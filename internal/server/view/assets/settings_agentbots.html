                        No AI agent found on this server. Install Pi with <code>curl -fsSL https://pi.dev/install.sh | sh</code>, run <code>pi</code> once to sign in, then look again.
                      </p>

                      <div class="bot-setup-model" x-show="botSetup.agentId">
                        <label class="agent-bot-form-label">Model</label>
{{template "cselect-open" `botSetup.model === '' ? 'Choose a model' : (botSetup.model === 'default' ? 'Default' : botSetup.model)`}}<template x-for="m in setupModels()" :key="m.id"><button type="button" class="cselect-option" :class="botSetup.model===m.id?'sel':''" :disabled="botSetup.creating" @click="pickSetupModel(m.id); csOpen=false"><span class="dot dot--fg cselect-option-dot"></span><span :title="(m.label && m.label !== m.id) ? m.label : ''" x-text="m.id === 'default' ? 'Default' : m.id"></span></button></template>{{template "cselect-close"}}

                  <template x-for="(m, mi) in agentBotsList" :key="m.id">

            <template x-if="agentBotFormMode">

                      <div>

                      </div>
                      <div style="flex:0 0 auto;min-width:90px">
                        <label class="agent-bot-form-label">Enabled</label>
                        <div class="seg">
                          <button type="button" class="seg-btn" :class="{active: !agentBotDraft.enabled}" @click="agentBotDraft.enabled = false">Off</button>
                          <button type="button" class="seg-btn" :class="{active: agentBotDraft.enabled}" @click="agentBotDraft.enabled = true">On</button>

                      <div>
                        <label class="agent-bot-form-label">Agent</label>
{{template "cselect-open" `(agents.find(function(a){return a.id===agentBotDraft.agentId&&a.available;}) || {name: 'Select agent'}).name`}}<template x-for="a in agents.filter(function(a){return a.available;})" :key="a.id"><button type="button" class="cselect-option" :class="agentBotDraft.agentId===a.id?'sel':''" @click="agentBotDraft.agentId=a.id; onAgentBotAgentChange(); csOpen=false"><span class="dot dot--fg cselect-option-dot"></span><span x-text="a.name"></span></button></template>{{template "cselect-close"}}
                      </div>
                      <div>
                        <label class="agent-bot-form-label">Model</label>
{{template "cselect-open" `(agentBotDraft.model && agentBotDraft.model !== 'default') ? agentBotDraft.model : 'Default'`}}<button type="button" class="cselect-option" :class="(!agentBotDraft.model||agentBotDraft.model==='default')?'sel':''" @click="agentBotDraft.model=''; csOpen=false"><span class="dot dot--fg cselect-option-dot"></span><span>Default</span></button><template x-for="m in agentBotModelsForAgent(agentBotDraft.agentId).filter(function(m){return m.id!=='default';})" :key="m.id"><button type="button" class="cselect-option" :class="agentBotDraft.model===m.id?'sel':''" @click="agentBotDraft.model=m.id; csOpen=false"><span class="dot dot--fg cselect-option-dot"></span><span :title="(m.label && m.label !== m.id) ? m.label : ''" x-text="m.id"></span></button></template>{{template "cselect-close"}}
                      </div>
                    </div>
                    <div>
                      <label class="agent-bot-form-label">System Prompt</label>
                      <textarea class="field-input agent-bot-form-textarea" x-model="agentBotDraft.systemPrompt" rows="3"
                                x-init="agentBotAutoGrow($el)" @input="agentBotAutoGrow($el)"

                    <div class="agent-bot-cwd">
                      <span class="agent-bot-form-label">Working directory</span>

                  <section class="agent-bot-form-section" role="tabpanel" x-show="botFormTab === 'skills'">
                    <p class="agent-bot-section-desc">Pick the skills this bot can use; hover one to see what it does.
                      <span x-show="agentBotDraft.main">Built-in skills are always on for the main bot.</span>

                    <div class="agent-bot-skill-chips" x-show="extraSkills.length">

                        <button type="button" class="btn-outline btn--xs" :class="{active: agentBotSkills[s.name]}" :aria-pressed="!!agentBotSkills[s.name]"

                  <section class="agent-bot-form-section agent-bot-form-section-triggers" role="tabpanel" x-show="botFormTab === 'triggers'">
                    <p class="agent-bot-section-desc">Run this bot on vault events or on a schedule. Each trigger sends a prompt template to the agent.</p>
                    <div class="agent-bot-trigger-list">
                      <template x-for="(t, ti) in agentBotTriggers" :key="ti">
                        <div class="agent-bot-trigger-card" :class="{'is-open': t._open, 'is-off': !t.enabled}">

                                <button type="button" class="seg-btn" :class="{active: !t.enabled}" @click="t.enabled = false">Off</button>

                              <div class="agent-bot-block-label">
                                <span class="agent-bot-block-title">Event</span>
                                <span class="agent-bot-block-hint" x-text="agentBotTriggerHint(t)"></span>
                              </div>
{{template "cselect-open" `(agentBotEventDefs.find(function(d){return d.type===(t.eventTypes[0]||'');}) || {label: 'Select event…'}).label`}}<template x-for="def in agentBotEventDefs" :key="def.type"><button type="button" class="cselect-option" :class="(t.eventTypes[0]||'')===def.type ? 'sel' : ''" :title="def.description" @click="setAgentBotET(t, def.type); csOpen=false"><span class="dot dot--fg cselect-option-dot"></span><span x-text="def.label"></span></button></template>{{template "cselect-close"}}
                            </div>

                                </div>
                                <div class="seg agent-bot-schedule-kind-seg">
                                  <button type="button" class="seg-btn" :class="{active: scheduleKindOf(t)==='every'}" @click="setScheduleKind(t, 'every')">Every</button>
                                  <button type="button" class="seg-btn" :class="{active: scheduleKindOf(t)==='daily'}" @click="setScheduleKind(t, 'daily')">Daily</button>
                                  <button type="button" class="seg-btn" :class="{active: scheduleKindOf(t)==='weekly'}" @click="setScheduleKind(t, 'weekly')">Weekly</button>

                                <template x-if="scheduleKindOf(t) === 'every'">
                                  <div class="agent-bot-schedule-kind-body">
                                    <div class="agent-bot-schedule-presets">
                                      <template x-for="p in agentBotSchedulePresets.every" :key="p.value">
                                        <button type="button" class="btn-outline btn--xs"
                                                :class="(t.schedule || '') === p.value ? 'active' : ''"

                                      </template>

                                    <span class="agent-bot-block-hint">Minimum interval: 15 minutes. For another interval, edit the text below.</span>

                                </template>

                                    <span>server local time</span>
                                  </div>
                                </template>

                                <template x-if="scheduleKindOf(t) === 'weekly'">
                                  <div class="agent-bot-schedule-kind-body">
                                    <label class="agent-bot-schedule-custom-label">Days</label>
                                    <div class="agent-bot-schedule-presets agent-bot-weekday-toggles">
                                      <template x-for="d in agentBotWeekdayDefs" :key="d.abbr">
                                        <button type="button" class="btn-outline btn--xs"

                                      <span>server local time</span>

                      </div>
                      <template x-if="botChannels.discord">

                            <input type="password" class="field-input cfg-input" autocomplete="off" spellcheck="false" placeholder="Bot token" x-model="dcToken">
                            <input type="text" class="field-input cfg-input" autocomplete="off" spellcheck="false" placeholder="Your user ID" x-model="dcOwner">
                            <button type="button" class="btn-solid" @click="connectDiscord()" :disabled="!!channelBusy || !dcToken.trim() || !dcOwner.trim()" x-text="channelBusy === 'discord' ? 'Connecting…' : 'Connect'"></button>
                          </div>
                        </div>
                      </template>
                    </div>

                    <div class="cfg-link hairline">
                      <div class="cfg-link-head">
                        <span class="cfg-link-title">Telegram</span>
                        <span class="badge" :class="{ 'badge--ok': botChannels.telegram }" x-text="botChannels.telegram ? 'Connected' : 'Not connected'"></span>
                      </div>
                      <template x-if="botChannels.telegram">
                        <div>
                          <p class="cfg-link-meta">Paired with <code x-text="botChannels.telegram.display"></code>. Only the account that tapped Start can talk to it.</p>
                          <div class="cfg-link-actions">
                            <button type="button" class="btn-solid btn-solid--danger" @click="disconnectChannel('telegram')" :disabled="!!channelBusy" x-text="channelBusy === 'telegram' ? 'Disconnecting…' : 'Disconnect'"></button>
                          </div>
                        </div>
                      </template>
                      <template x-if="!botChannels.telegram">
                        <div>
                          <p class="cfg-link-meta">Create a bot with <a href="https://t.me/BotFather" target="_blank" rel="noopener noreferrer">@BotFather</a>, paste its token, then open the link on your phone and tap Start.</p>
                          <div class="cfg-link-actions" x-show="!tgCode">
                            <input type="password" class="field-input cfg-input" autocomplete="off" spellcheck="false" placeholder="123456:ABC-DEF…" x-model="tgToken" @keydown.enter.prevent="startTelegram()">
                            <button type="button" class="btn-solid" @click="startTelegram()" :disabled="!!channelBusy || !tgToken.trim()" x-text="channelBusy === 'telegram' ? 'Checking…' : 'Connect'"></button>
                          </div>
                          <div x-show="tgCode">
                            <div class="cfg-link-qr">
                              <img :src="tgImage" alt="Telegram bot link QR code" x-show="tgImage">
                              <p class="cfg-link-status">Scan with your phone, or open <a :href="tgLink" target="_blank" rel="noopener noreferrer" x-text="tgUsername ? '@' + tgUsername : tgLink"></a> and tap Start.</p>
                            </div>
                            <div class="cfg-link-actions">
                              <button type="button" class="btn-outline" @click="cancelTelegram()">Cancel</button>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                    <p class="cfg-link-err" x-show="channelError" x-text="channelError"></p>
                  </section>

                </div>
              </div>
            </template>

           </div><!-- .agent-bots-scroll -->

            <div class="agent-bot-form-footer hairline" x-show="agentBotFormMode">
              <button class="btn-solid" type="button"
                      :disabled="!agentBotDraft.name.trim() || agentBotSaving"
                      @click="saveAgentBot()"
                      x-text="agentBotSaving ? 'Saving…' : 'Save'"></button>
              <button class="btn-outline" type="button" @click="closeAgentBotForm()">Cancel</button>
              <span class="agent-bot-form-err" x-text="agentBotSaveError"></span>
            </div>

          </div><!-- .agent-bots-pane -->
