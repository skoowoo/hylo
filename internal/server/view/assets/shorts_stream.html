<hx-partial hx-target="#shorts-stream-groups" hx-swap="beforeend">
{{template "shorts-days" .}}
</hx-partial>
<hx-partial hx-target="#shorts-load-more" hx-swap="innerHTML">
  {{if .HasMore}}
  <div class="shorts-load-more-wrap">
    <button class="shorts-loadmore-btn"
            hx-get="/shorts/stream?before={{urlquery .Cursor}}">
      Load earlier
    </button>
  </div>
  {{else}}
  <p class="shorts-end-msg hairline">— beginning —</p>
  {{end}}
</hx-partial>
