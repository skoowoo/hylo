{{/* Shared markup components; arguments come in through dict. */}}
{{define "cselect-open"}}<div class="cselect" x-data="{ csOpen: false }" @click.outside="csOpen = false"><button type="button" class="cselect-btn" :class="{open: csOpen}" @click="csOpen = !csOpen" @keydown.escape="csOpen = false"><span class="cselect-btn-text" x-text="{{.}}"></span>{{icon "chevron-down"}}</button><div class="cselect-dropdown" x-show="csOpen">{{end}}
{{define "cselect-close"}}</div></div>{{end}}
{{define "toolbar-refresh"}}<button class="btn-outline" :class="{spinning: {{.Loading}}}" @click="{{.Click}}" :disabled="{{.Loading}}">{{icon "refresh"}}<span x-text="{{.Loading}} ? '{{.Busy}}' : 'Refresh'"></span></button>{{end}}
