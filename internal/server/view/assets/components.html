{{/* Shared markup components; arguments come in through dict. */}}
{{define "cselect-open"}}<div class="cselect" x-data="{ csOpen: false }" @click.outside="csOpen = false"><button type="button" class="cselect-btn" :class="{open: csOpen}" @click="csOpen = !csOpen" @keydown.escape="csOpen = false"><span class="cselect-btn-text" x-text="{{.}}"></span><svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg></button><div class="cselect-dropdown" x-show="csOpen">{{end}}
{{define "cselect-close"}}</div></div>{{end}}
{{define "toolbar-refresh"}}<button class="btn-outline" :class="{spinning: {{.Loading}}}" @click="{{.Click}}" :disabled="{{.Loading}}"><svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 3v5h5"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path stroke-linecap="round" stroke-linejoin="round" d="M16 16h5v5"/></svg><span x-text="{{.Loading}} ? '{{.Busy}}' : 'Refresh'"></span></button>{{end}}
