{{/* Agents tab: detected CLI agents and their models. The agents list is shared with Bots, so it lives in settings_modal.js. */}}
          <div class="settings-page" x-show="tab === 'agents'">
           <div class="settings-body">
            <div class="settings-toolbar">
              <span class="settings-toolbar-note" x-show="!agentsLoading && agents.length">
                <span x-text="agents.filter(a=>a.available).length + ' available · ' + agents.filter(a=>!a.available).length + ' not installed'"></span>
                <span x-show="agentsFromCache && agentsCachedAt"
                      x-text="' · checked ' + Math.round((Date.now() - agentsCachedAt) / 60000) + 'm ago'"></span>
              </span>
              <div class="settings-toolbar-end">
{{template "toolbar-refresh" (dict "Loading" `agentsLoading` "Click" `loadAgents(true)` "Busy" `Detecting…`)}}
              </div>
            </div>
            <div class="settings-status" x-show="agentsLoading">Detecting agents…</div>
            <div class="settings-status settings-status--err" x-show="agentsError && !agentsLoading" x-text="'Error: ' + agentsError"></div>
            <div class="settings-list" x-show="!agentsLoading && !agentsError && agents.length">
              <template x-for="ag in sortedAgents" :key="ag.id">
                <div class="settings-row settings-row--lead agent-row" :class="{'is-off': !ag.available}">
                  <span class="dot" :class="ag.available ? 'dot--on' : 'dot--off'"></span>
                  <div class="agent-row-text">
                    <span class="settings-row-label">
                      <span class="settings-label" x-text="ag.name"></span>
                      <span class="settings-key" x-text="ag.id"></span>
                    </span>
                    <span class="settings-desc agent-meta">
                      <span class="agent-meta-path" :title="ag.path || ag.bin" x-text="ag.path || ag.bin || '—'"></span>
                      <span x-show="ag.version" x-text="'v' + ag.version"></span>
                      <span x-show="ag.streamFormat" x-text="ag.streamFormat"></span>
                    </span>
                    <div class="agent-models" x-show="ag.models && ag.models.length">
                      <template x-for="m in agentDisplayModels(ag)" :key="m.id">
                        <span class="badge badge--sm agent-model-pill" :title="(m.label && m.label !== m.id) ? m.id + ' — ' + m.label : m.id" x-text="m.id"></span>
                      </template>
                      <span class="settings-desc" x-show="ag.models && ag.models.length > 4" x-text="'+' + (ag.models.length - 4) + ' more'"></span>
                    </div>
                  </div>
                  <div class="settings-row-ctrl">
                    <span class="settings-msg" x-show="!ag.available">Not installed</span>
                    <button type="button" class="btn-ghost btn--xs" x-show="ag.available && ag.cliExample" :title="ag.cliExample"
                            @click.stop="copyCliExample(ag)" x-text="agentCopied === ag.id ? 'Copied' : 'Copy command'"></button>
                  </div>
                </div>
              </template>
            </div>
           </div>
          </div>
