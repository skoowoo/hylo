<div class="sec chat-main" id="chat-root">
  <template id="chat-setup-icon">{{sideIcon "bot"}}</template>

  <div class="home-list-head">
    <button class="chat-switch" id="chat-switch" type="button" title="Chats" aria-haspopup="menu" aria-expanded="false" style="display:none">
      <span class="chat-switch-bot" id="chat-bot-name"></span>
      <span class="chat-switch-sep" aria-hidden="true">/</span>
      <span class="chat-switch-title" id="chat-title"></span>
      {{icon "chevron-down"}}
    </button>
    <div class="home-list-head-spacer"></div>
    <button class="icon-btn-ghost" id="chat-triggers-btn" type="button" title="Triggers" aria-label="Triggers" style="display:none">
      {{icon "sliders"}}
    </button>
  </div>

  <div class="sec-body overlay-scroll chat-scroll" id="chat-scroll">
    <div class="chat-scroll-inner" id="chat-thread"></div>
  </div>

  <button type="button" class="chat-scroll-bottom-btn" id="chat-jump" title="Scroll to latest" style="display:none">
    {{icon "arrow-down"}}
  </button>

  <div class="chat-input-outer" id="chat-input-outer">
    <div class="chat-ac-panel" id="chat-cmd-panel" hidden>
      <div class="ac-head" id="chat-cmd-head" hidden></div>
      <ul class="ac-list" id="chat-cmd-list" role="listbox"></ul>
      <div class="ac-hint" id="chat-cmd-hint" hidden></div>
    </div>
    <div class="chat-ac-wrap">
      <div class="chat-context" id="chat-context" hidden></div>
      <div class="chat-input-dock">
        <div class="chat-input-card" id="chat-input-card">
          <div class="compose-thumbs chat-pending-images" id="chat-pending-images" hidden></div>
          <div class="chat-input-row">
            <button type="button" class="chat-add" id="chat-add" title="Add" aria-label="Commands" aria-haspopup="listbox" aria-expanded="false" aria-controls="chat-cmd-panel" disabled>
              <!-- lucide "plus" -->
              {{icon "plus"}}
            </button>
            <div class="chat-input-hint" id="chat-input-hint" aria-hidden="true">
              <span class="chat-hint-name" id="chat-hint-name"></span>
            </div>
            <div class="chat-input-scroll">
              <textarea class="chat-textarea" id="chat-textarea" rows="1" placeholder="" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
            </div>
            <input type="file" id="chat-file-input" class="chat-file-input" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
            <button type="button" class="chat-send-circle" id="chat-send" disabled>
              {{icon "arrow-up"}}
            </button>
            <button type="button" class="chat-stop-circle" id="chat-stop" style="display:none">
              {{icon "stop" `fill="currentColor"`}}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
