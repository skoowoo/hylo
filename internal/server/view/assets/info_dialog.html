
  <div id="info-dialog"
       x-data="infoDialogCtrl()"
       x-show="open"
       x-trap.inert="open"
       x-cloak
       class="dialog-overlay info-overlay"
       role="dialog" aria-modal="true"
       @click.self="close()">
    <div class="dialog-card info-card">
      <p class="dialog-title info-title" x-text="title"></p>
      <div class="info-body" x-html="bodyHTML"></div>
      <div class="dialog-actions info-actions">
        <button type="button" class="btn-solid" :class="{ 'btn-solid--danger': isError }" @click="close()" x-text="closeLabel"></button>
      </div>
    </div>
  </div>
