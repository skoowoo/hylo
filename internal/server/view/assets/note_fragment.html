<header class="frag-cover">
  {{- if or (ne .Dir "/") .UpdatedAt}}
  <p class="frag-dir">
    {{- if ne .Dir "/"}}<span>{{.Dir}}</span>{{end}}
    {{- if .UpdatedAt}}<span class="frag-time">{{.UpdatedAt}}</span>{{end -}}
  </p>
  {{- end}}
  <h1 class="frag-title" id="frag-cover-title">{{.CoverTitle}}</h1>
</header>

<article class="prose frag-article">{{.Content}}</article>
{{- if .Truncated}}
<p class="frag-more">Preview ends here · <kbd class="kbd">↵</kbd> opens the full note</p>
{{- end}}
