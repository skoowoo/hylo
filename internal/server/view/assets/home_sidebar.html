{{define "home-side-folders-inner"}}
    {{range .Folders}}
    <button type="button" class="side-nav-item home-side-child home-drop-target" x-bind:class="{'is-active': activeKey === 'dir:{{.Dir}}'}"
            data-drop-dir="{{.Dir}}"
            x-on:click="selectFolder('{{.Dir}}','/home/section?type=folder&path={{encdir .Dir}}')">
      <svg class="home-side-child-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
           stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
      </svg>
      <span class="home-side-child-name">{{folderLabel .Dir}}</span>
    </button>
    {{end}}
    {{if not .Folders}}<div class="home-side-empty">No folders</div>{{end}}
{{end}}

{{define "home-side-knowledge-inner"}}
    <button type="button" class="side-nav-item home-side-child" x-bind:class="{'is-active': activeKey === 'knowledge:'}"
            x-on:click="selectKnowledgeIndex('')">
      <span class="home-side-child-name">All</span>
      <span class="home-side-count">{{.KnowledgeCount}}</span>
    </button>
    {{range .IndexNotes}}
    <button type="button" class="side-nav-item home-side-child" x-bind:class="{'is-active': activeKey === 'knowledge:{{.Path}}'}"
            x-on:click="selectKnowledgeIndex('{{.Path}}')">
      <span class="home-side-child-name">{{label .}}</span>
      <span class="home-side-count">{{.DepCount}}</span>
    </button>
    {{end}}
{{end}}
