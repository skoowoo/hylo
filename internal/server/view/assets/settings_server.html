{{/* Server tab: the server being edited, its config section picker, and a section's fields. */}}
          <div class="settings-page" x-show="tab === 'server'">
            <div class="settings-body" x-init="$store.servers.load()">

              <div class="srv-notice" x-show="switchConfirm" x-cloak>
                <span x-text="'Switching reloads the window. Discard ' + Object.keys(patch).length + ' unsaved change' + (Object.keys(patch).length !== 1 ? 's' : '') + '?'"></span>
                <span class="srv-notice-actions">
                  <button type="button" class="btn-solid btn--xs" @click="confirmSwitch()">Discard and switch</button>
                  <button type="button" class="btn-outline btn--xs" @click="switchConfirm = ''">Cancel</button>
                </span>
              </div>
              <div class="srv-notice" x-show="switching" x-cloak>Switching…</div>
              <p class="settings-intro settings-msg--err" x-show="switchError" x-text="switchError"></p>

              <template x-if="!openSection">
                <div>
                  <div class="settings-list srv-head">
                    <div class="settings-row settings-row--lead">
                      <span class="srv-dot" :class="'is-' + heroState"></span>
                      <div>
                        <span class="settings-label" x-text="heroName"></span>
                        <span class="settings-desc srv-url" x-text="heroSub"></span>
                      </div>
                      <div class="settings-row-ctrl">
                        <button type="button" class="btn-outline btn--xs" x-show="$store.servers.available" @click="$store.servers.openManager()">Manage servers</button>
                      </div>
                    </div>
                    <div class="settings-row" x-show="isDesktop && serverManaged && editingLocalServer">
                      <div>
                        <span class="settings-label">Server process</span>
                        <span class="settings-desc">Started by this app.</span>
                      </div>
                      <div class="settings-row-ctrl">
                        <button class="btn-outline btn-outline--danger btn--xs"
                                @click="stopServer()"
                                :disabled="!serverRunning || serverStopping"
                                x-text="serverStopping ? 'Stopping…' : (serverRunning ? 'Stop' : 'Stopped')"></button>
                      </div>
                    </div>
                    <template x-for="section in (cfgLoading || cfgError ? [] : globalSections)" :key="section">{{template "cfg-section"}}
                    </template>
                  </div>
                  <p class="settings-intro settings-msg--err" x-show="serverStopError" x-text="serverStopError"></p>

                  <template x-for="group in sectionGroups.filter(g => g.id !== 'global')" :key="group.id">
                    <section class="settings-section" x-show="!cfgLoading && !cfgError">
                      <h3 class="settings-section-title">
                        <span x-text="group.label"></span>
                        <small class="cfg-vault-path" x-show="group.id === 'vault' && vaultPath" :title="vaultPath" x-text="vaultPath"></small>
                      </h3>
                      <div class="settings-list">
                        <template x-for="section in group.sections" :key="section">{{template "cfg-section"}}
                        </template>
                      </div>
                    </section>
                  </template>
                </div>
              </template>

              <div class="settings-status" x-show="cfgLoading">Loading configuration…</div>
              <div class="settings-status settings-status--err" x-show="cfgError && !cfgLoading" x-text="'Error: ' + cfgError"></div>

              <template x-if="openSection && !cfgLoading && !cfgError">
                <div>
                  <div class="settings-list">
                    <template x-for="field in fieldsForSection(openSection)" :key="field.key">
{{template "cfg-field"}}
                    </template>
                  </div>
                </div>
              </template>

            </div>

            <div class="settings-foot" x-show="!cfgLoading && !cfgError">
              <div class="settings-foot-status">
                <span class="settings-msg settings-msg--ok" x-show="cfgSaveOk && !hasDirty">Saved</span>
                <span class="settings-msg settings-msg--err" x-show="cfgSaveError" x-text="cfgSaveError"></span>
                <span class="settings-msg settings-msg--err" x-show="cfgRestartError" x-text="cfgRestartError"></span>
                <span class="settings-msg" x-show="cfgRestarting">Restarting server…</span>
                <span class="badge" x-show="hasDirty"
                      x-text="Object.keys(patch).length + ' unsaved change' + (Object.keys(patch).length !== 1 ? 's' : '')"></span>
                <span class="settings-msg"
                      x-show="!hasDirty && !cfgSaveOk && !cfgSaveError && !cfgRestartError && !cfgRestarting">
                  Saving restarts the server.
                </span>
              </div>
              <button class="btn-outline" x-show="hasDirty" @click="discardAll()">Discard</button>
              <button class="btn-solid"
                      @click="saveConfig()"
                      :disabled="!hasDirty || cfgSaving || cfgRestarting"
                      x-text="cfgRestarting ? 'Restarting…' : cfgSaving ? 'Saving…' : 'Save all'"></button>
            </div>
          </div>

{{define "cfg-field"}}
                      <div class="settings-row"
                           :class="{'is-dirty': isDirty(field.key), 'settings-row--block': field.type === 'string_list' || field.multiline, 'settings-row--input': field.type !== 'bool' && field.type !== 'string_list' && !field.multiline}">
                        <div>
                          <span class="settings-label cfg-label" :title="field.key" x-text="field.label"></span>
                          <span class="settings-desc" x-text="field.description"></span>
                        </div>
                        <div class="settings-row-ctrl">
                          <template x-if="field.type === 'bool'">
                            <div class="seg">
                              <button type="button" class="seg-btn" :class="{active: !getVal(field.key)}" @click="setVal(field.key, false)">Off</button>
                              <button type="button" class="seg-btn" :class="{active: !!getVal(field.key)}" @click="setVal(field.key, true)">On</button>
                            </div>
                          </template>
                          <template x-if="field.type === 'string' && field.enum && field.enum.length">
                            <select class="field-input" @change="setVal(field.key, $event.target.value)">
                              <template x-for="opt in (field.enum || [])" :key="opt">
                                <option :value="opt" :selected="getVal(field.key) === opt" x-text="opt"></option>
                              </template>
                            </select>
                          </template>
                          <template x-if="field.type === 'int'">
                            <input type="number" class="field-input field-input--mono cfg-number"
                                   :value="getVal(field.key)"
                                   @change="setVal(field.key, Number($event.target.value))"
                                   :min="field.constraints ? field.constraints.min : undefined"
                                   :max="field.constraints ? field.constraints.max : undefined">
                          </template>
                          <template x-if="field.type === 'string_list'">
                            <textarea class="field-input field-input--mono" rows="3" placeholder="One entry per line"
                                      :value="listToText(getVal(field.key))"
                                      @change="setVal(field.key, textToList($event.target.value))"></textarea>
                          </template>
                          <template x-if="field.sensitive && field.type !== 'bool' && field.type !== 'string_list'">
                            <div class="cfg-input-group">
                              <input class="field-input field-input--mono"
                                     :type="revealed[field.key] ? 'text' : 'password'"
                                     :value="getVal(field.key) || ''"
                                     :placeholder="(secrets[field.key] && !getVal(field.key)) ? '••• set •••' : (field.default != null ? String(field.default) : '')"
                                     @input="setVal(field.key, $event.target.value)">
                              <button type="button" class="icon-btn icon-btn--lg"
                                      @click.stop="toggleReveal(field.key)"
                                      :title="revealed[field.key] ? 'Hide' : 'Reveal'">
                                {{icon "eye" `x-show="!revealed[field.key]"`}}
                                {{icon "eye-off" `x-show="revealed[field.key]"`}}
                              </button>
                            </div>
                          </template>
                          <template x-if="!field.sensitive && field.type === 'string' && field.multiline && !(field.enum && field.enum.length)">
                            <textarea class="field-input" rows="6"
                                      :value="getVal(field.key) ?? ''"
                                      :placeholder="field.default != null ? String(field.default) : ''"
                                      @input="setVal(field.key, $event.target.value)"></textarea>
                          </template>
                          <template x-if="!field.sensitive && (field.type === 'string' || field.type === 'duration') && !field.multiline && !(field.enum && field.enum.length)">
                            <div class="cfg-input-group">
                              <input type="text" class="field-input field-input--mono"
                                     :value="getVal(field.key) ?? ''"
                                     :placeholder="field.default != null ? String(field.default) : ''"
                                     @input="setVal(field.key, $event.target.value)">
                              <template x-if="field.key === 'vault.path' && isDesktop">
                                <button type="button" class="icon-btn icon-btn--lg" title="Browse for folder"
                                        @click="pickFolder(field.key, getVal(field.key))">{{icon "folder"}}</button>
                              </template>
                            </div>
                          </template>
                        </div>
                      </div>
{{end}}

{{define "cfg-section"}}
                          <div class="cfg-item">
                            <template x-if="fieldsForSection(section).length === 1">
                              <div x-data="{ get field() { return fieldsForSection(section)[0]; } }">
{{template "cfg-field"}}
                              </div>
                            </template>
                            <template x-if="fieldsForSection(section).length > 1">
                              <button type="button" class="settings-row settings-row--nav" @click="openSectionDetail(section)">
                                <div>
                                  <span class="settings-row-label">
                                    <span class="settings-label" x-text="sectionLabel(section)"></span>
                                    <span class="dot dot--accent" x-show="sectionHasDirty(section)" title="Unsaved changes"></span>
                                  </span>
                                  <span class="settings-desc" x-text="sectionIntro(section)"></span>
                                </div>
                                {{icon "chevron-right" "settings-row-chev"}}
                              </button>
                            </template>
                          </div>{{end}}
