<div class="sec">
  <div class="home-list-head">
    <span class="home-list-count" title="Unread" x-show="unreadCount > 0" {{xshow (gt .Boot.UnreadCount 0)}} x-text="unreadCount">{{.Boot.UnreadCount}}</span>
    <div class="home-list-head-spacer"></div>
    <div class="seg">
      <button type="button" class="seg-btn" :class="inboxFilter === 'all' ? 'active' : ''" @click="setInboxFilter('all')">All</button>
      <button type="button" class="seg-btn" :class="inboxFilter === 'unread' ? 'active' : ''" @click="setInboxFilter('unread')">Unread</button>
    </div>
    <button type="button" class="icon-btn home-inbox-mark-all-btn" title="Mark all read" x-show="unreadCount > 0" {{xshow (gt .Boot.UnreadCount 0)}} @click="markAllInboxRead()">{{icon "check"}}</button>
  </div>
  <div class="sec-body home-inbox-list" id="home-inbox-list" @scroll="onInboxListScroll($event)">
    <template x-for="g in inboxGroups()" :key="g.label">
      <div class="home-inbox-group">
        <div class="home-inbox-group-label" x-text="g.label"></div>
        <template x-for="m in g.items" :key="m.id">
          <div class="list-card list-card--clickable home-list-card home-inbox-card" :class="{ 'is-unread': !m.isRead }" x-press="selectInboxMessage(m)">
            <div class="home-inbox-avatar">
              <span class="avatar avatar--md" x-html="agentBotAvatar(m.source)"></span>
              <div class="dot dot--fg home-inbox-unread-dot"></div>
            </div>
            <div class="home-inbox-card-content">
              <div class="home-inbox-card-top">
                <span class="home-inbox-card-name" x-text="m.source"></span>
                <span class="home-inbox-card-time" x-text="relTime(m.createdAt)"></span>
              </div>
              <div class="home-inbox-card-title" x-show="m.title && m.title !== m.source" x-text="m.title"></div>
              <div class="home-inbox-card-snippet" x-text="inboxSnippet(m.body)"></div>
            </div>
          </div>
        </template>
      </div>
    </template>
    <div class="home-list-empty" x-show="inboxLoadingMore" style="padding:1rem 0">Loading more…</div>
  </div>
  <template x-if="!inboxLoading && visibleInboxMessages().length === 0">
    <div class="empty-state empty-state--page">
      <div class="empty-state-icon">{{sideIcon "inbox"}}</div>
      <div class="empty-state-title" x-text="inboxFilter === 'unread' ? 'All caught up' : 'No messages yet'"></div>
      <div class="empty-state-desc" x-show="inboxFilter !== 'unread'">Messages from your bots show up here.</div>
    </div>
  </template>
</div>
