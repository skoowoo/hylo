  <!-- Sidebar + note list ─────────────────────────────────────────── -->
  <div class="home-shell"
       :class="{'content-pane-open': (contentPaneOpen || inboxSheetOpen), 'is-resizing': isPaneResizing, 'is-editor-maximized': splitRatio <= 0.02}"
       :style="'--split-ratio:' + splitRatio + ';--split-ratio-inv:' + (1 - splitRatio)">
    <aside class="home-side hairline" id="home-side">
      <div class="home-side-top">
        <button type="button" class="icon-btn-ghost"
                :title="/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? 'Search (⌘K)' : 'Search (Ctrl+K)'"
                @click="window.dispatchEvent(new CustomEvent('open-search'))">
          <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8" /><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.34-4.34" />
          </svg>
        </button>
        <button type="button" class="icon-btn-ghost" title="New note (Ctrl+N)"
                onclick="window.__hyloContentPane && void window.__hyloContentPane.openNewInContentPane()">
          <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <button type="button" class="icon-btn-ghost home-side-bottom-btn" :class="{'is-active': contentPaneOpen}"
                :title="/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? 'Reading pane (⌘O)' : 'Reading pane (Ctrl+O)'"
                @click="contentPaneOpen = !contentPaneOpen">
          <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 3v18" />
            <path stroke-linecap="round" stroke-linejoin="round" d="m10 15-3-3 3-3" />
          </svg>
        </button>
      </div>

      <nav class="home-side-nav"
           @scroll.passive="$el.style.setProperty('--fade-top', Math.min($el.scrollTop, 24) + 'px')">

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': curType() === 'inbox'}"
                x-press="go('/home/section?type=inbox')">
          {{sideIcon "inbox"}}
          <span class="home-side-label">Inbox</span>
          <span class="home-side-count" x-show="unreadCount > 0" x-text="unreadCount"></span>
        </button>

        <div class="home-side-group">
          <button type="button" class="side-nav-item home-side-item home-side-item--parent"
                  :class="{'is-active': curType() === 'chat' && !selectedAgentBotId}"
                  x-press="go('/home/section?type=chat')">
            {{sideIcon "bot"}}
            <span class="home-side-label">Agent Bots</span>
            <svg class="home-side-chevron" :class="{'is-open': chatsOpen}" @pointerdown.stop @click.stop="chatsOpen = !chatsOpen"
                 fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
            </svg>
          </button>
          <div class="home-side-children" id="home-side-chats-body" :class="{'is-open': chatsOpen}" x-cloak>
            <div class="home-side-children-inner">
              <template x-for="m in agentBots" :key="m.id">
                <button type="button" class="side-nav-item home-side-child" :class="{'is-active': curType() === 'chat' && selectedAgentBotId === m.id}"
                        x-press="selectChatAgentBot(m.id)">
                  <span class="avatar avatar--sm avatar--accent home-side-child-avatar" :style="'background:' + agentBotColor(m.name) + ';color:var(--inverse-ink)'"
                        x-text="agentBotInitials(m.name)"></span>
                  <span class="home-side-child-name" x-text="m.name"></span>
                </button>
              </template>
              <div class="home-side-empty" x-show="agentBots.length === 0">No agent bots yet</div>
            </div>
          </div>
        </div>

        <div class="home-side-sep hairline"></div>

        <div class="home-side-group">
          <button type="button" class="side-nav-item home-side-item home-side-item--parent"
                  x-press="knowledgeOpen = !knowledgeOpen">
            {{sideIcon "knowledge"}}
            <span class="home-side-label">Knowledge</span>
            <svg class="home-side-chevron" :class="{'is-open': knowledgeOpen}"
                 fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
            </svg>
          </button>
          <div class="home-side-children" id="home-side-knowledge-body" x-bind:class="{'is-open': knowledgeOpen}" x-cloak>
            <div class="home-side-children-inner">
{{template "home-side-knowledge-inner" .}}
            </div>
          </div>
        </div>

        <button type="button" class="side-nav-item home-side-item"
                :class="{'is-active': curType() === 'tags'}"
                x-press="go('/home/section?type=tags')">
          {{sideIcon "tags"}}
          <span class="home-side-label">Tags</span>
        </button>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': curType() === 'memory'}"
                x-press="go('/home/section?type=memory')">
          {{sideIcon "memory"}}
          <span class="home-side-label">Memory</span>
        </button>

        <div class="home-side-sep hairline"></div>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': curType() === 'pinned'}"
                x-press="go('/home/section?type=pinned')">
          {{sideIcon "star"}}
          <span class="home-side-label">Pinned</span>
        </button>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': curType() === 'shorts'}"
                x-press="go('/home/section?type=shorts')">
          {{sideIcon "shorts"}}
          <span class="home-side-label">Shorts</span>
        </button>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': curType() === 'images'}"
                x-press="go('/home/section?type=images')">
          {{sideIcon "images"}}
          <span class="home-side-label">Images</span>
        </button>

        <div class="home-side-group">
          <button type="button" class="side-nav-item home-side-item home-side-item--parent" x-press="foldersOpen = !foldersOpen">
            {{sideIcon "folders"}}
            <span class="home-side-label">Folders</span>
            <svg class="home-side-chevron" :class="{'is-open': foldersOpen}" fill="none" stroke="currentColor"
                 stroke-width="1.7" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
            </svg>
          </button>
          <div class="home-side-children" id="home-side-folders-body" x-bind:class="{'is-open': foldersOpen}" x-cloak>
            <div class="home-side-children-inner">
{{template "home-side-folders-inner" .}}
            </div>
          </div>
        </div>

      </nav>

      <div class="home-side-bottom">
        <div class="cselect cselect--inline server-switcher" x-data="{open:false}" x-show="$store.servers.available" x-cloak
             x-init="$store.servers.load()" @click.outside="open=false" @keydown.escape="open=false">
          <button type="button" class="cselect-btn cselect-btn--ghost" :class="{open:open}" aria-label="Switch server"
                  @click="open = !open; if (open) $store.servers.refresh()">
            <span class="srv-dot" :class="'is-' + $store.servers.state($store.servers.activeId)"></span>
            <span class="cselect-btn-text" x-text="$store.servers.active() ? $store.servers.active().name : 'Server'"></span>
            <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="cselect-dropdown" x-show="open" x-cloak>
            <template x-for="s in $store.servers.items" :key="s.id">
              <button type="button" class="cselect-option" :class="{sel: s.active}"
                      @click="open = false; window.dispatchEvent(new CustomEvent('hylo:switch-server', {detail: {id: s.id}}))">
                <span class="srv-dot" :class="'is-' + $store.servers.state(s.id)"></span>
                <span class="srv-option-main">
                  <span class="srv-option-name" x-text="s.name"></span>
                  <span class="srv-option-url" x-text="s.kind === 'local' ? 'This computer' : $store.servers.host(s.url)"></span>
                </span>
              </button>
            </template>
            <div class="cselect-divider hairline"></div>
            <button type="button" class="cselect-option" @click="open = false; $store.servers.openManager()">
              <span>Manage servers…</span>
            </button>
          </div>
        </div>
        <button type="button" class="icon-btn-ghost home-side-bottom-btn" title="Settings"
                @click="$store.settingsModal.open = true; $el.blur()">
          <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
    </aside>

    <!-- Common parent for everything right of the sidebar (mirrors .home-side);
         closed in home.go once content_pane.html's markup is spliced in. -->
    <div class="home-main">
      <main class="home-list-pane" id="home-list-pane" hx-sync="this:replace">
        {{.SectionHTML}}
      </main>

      <!-- Resizer + editor pane below only show once a note is open in the
           content pane (see content_pane.html). -->
      <div class="home-pane-resizer" id="home-pane-resizer" x-cloak
           x-show="contentPaneOpen || inboxSheetOpen"
           @mousedown="startPaneResize($event)"
           @dblclick="splitRatio = 0.5"
           title="Drag to resize"></div>
