  <div class="home-container">
  <!-- Sidebar + note list ─────────────────────────────────────────── -->
  <div class="home-shell"
       :class="{'content-pane-open': layoutOpen, 'is-resizing': isPaneResizing, 'is-editor-maximized': layoutRatio <= 0.02}"
       :style="'--split-ratio:' + layoutRatio + ';--split-ratio-inv:' + (1 - layoutRatio)">
    <aside class="home-side hairline" id="home-side">
      <div class="home-side-top">
        <button type="button" class="icon-btn-ghost"
                :title="/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? 'Search (⌘K)' : 'Search (Ctrl+K)'"
                @click="window.dispatchEvent(new CustomEvent('open-search'))">
          {{icon "search"}}
        </button>
        <button type="button" class="icon-btn-ghost" title="New note (Ctrl+N)"
                onclick="window.__hyloContentPane && void window.__hyloContentPane.openNewInContentPane()">
          {{icon "new-note"}}
        </button>
        <button type="button" class="icon-btn-ghost home-side-bottom-btn" :class="{'is-active': contentPaneOpen}"
                :title="/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? 'Reading pane (⌘O)' : 'Reading pane (Ctrl+O)'"
                @click="contentPaneOpen ? closeContentPane() : showContentPane()">
          {{icon "reading-pane"}}
        </button>
      </div>

      <nav class="home-side-nav" x-init="initSideFade($el)" @scroll.passive="sideFade($el)">

        <!-- The editor's open tabs. They come from localStorage, so the script
             below swaps the placeholder for their reserved height before first
             paint (data-reserve). The placeholder is one row tall, so the first
             tab opening or the last closing moves nothing. :hidden, not x-show:
             x-show applies a frame late, after the reflow motion has measured. -->
        <div class="home-side-group home-side-open" id="home-side-open">
          <button type="button" class="side-nav-item home-side-item home-side-item--parent"
                  x-press="openTabsOpen = !openTabsOpen">
            {{sideIcon "open-tabs"}}
            <span class="home-side-label">Open</span>
            <span class="home-side-count home-side-count--plain" x-show="!openTabsOpen && tabs.length" x-cloak x-text="tabs.length"></span>
            <span class="home-side-chevron is-open" :class="{'is-open': openTabsOpen}">{{icon "chevron-right"}}</span>
          </button>
          <div class="home-side-children is-open" id="home-side-open-body" :class="{'is-open': openTabsOpen}"
               x-init="$nextTick(() => $el.removeAttribute('data-reserve'))">
            <div class="home-side-children-inner" :inert="agentWriting">
              <div class="side-nav-item home-side-child home-side-open-none" id="home-side-open-none" :hidden="tabs.length > 0">No open notes</div>
              <template x-for="(tab, i) in tabs" :key="tab.id">
                <div class="side-nav-item home-side-child home-side-tab" role="button" tabindex="-1"
                     :class="{'is-active': contentPaneOpen && i === activeTab}"
                     :title="tab.path || 'Untitled'"
                     x-press="selectTab(i)"
                     @mousedown.middle.prevent @auxclick="$event.button === 1 && contentPaneCloseTab(i)">
                  <span class="home-side-tab-status">
                    <span class="note-draft-icon" x-show="!tab.path">{{icon "draft"}}</span>
                    <span class="home-side-child-icon" x-show="tab.path && !(agentWriting && i === activeTab)">{{icon "note"}}</span>
                    <svg class="ssi-pending" x-show="agentWriting && i === activeTab" width="8" height="8" viewBox="0 0 8 8" fill="currentColor"><circle cx="4" cy="4" r="3.5"/></svg>
                  </span>
                  <span class="home-side-child-name" x-text="tab.title"></span>
                  <span class="home-side-tab-hint" x-show="tabHint(tab)" x-text="tabHint(tab)"></span>
                  <button type="button" class="home-side-tab-close" title="Close tab" tabindex="-1"
                          @pointerdown.stop @click.stop="contentPaneCloseTab(i)">
                    {{icon "close"}}
                  </button>
                </div>
              </template>
            </div>
          </div>
        </div>
        <div class="home-side-sep hairline"></div>
        <script>
          (function () {
            try {
              var vault = JSON.parse(document.getElementById('home-boot').textContent).vault;
              var data = JSON.parse(localStorage.getItem('hylo.content-pane:' + vault) || 'null');
              var n = Math.min(data && Array.isArray(data.tabs) ? data.tabs.filter(function (t) { return t.path; }).length : 0, 10);
              if (!n) return;
              document.getElementById('home-side-open-none').hidden = true;
              var body = document.getElementById('home-side-open-body');
              body.setAttribute('data-reserve', '');
              body.style.setProperty('--reserve-rows', n);
            } catch (_) {}
          })();
        </script>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': curType() === 'inbox'}"
                x-press="go('/home/section?type=inbox')">
          {{sideIcon "inbox"}}
          <span class="home-side-label">Inbox</span>
          <span class="home-side-count" x-show="unreadCount > 0" {{xshow (gt .Boot.UnreadCount 0)}} x-text="unreadCount">{{.Boot.UnreadCount}}</span>
        </button>

        <div class="home-side-group">
          <button type="button" class="side-nav-item home-side-item home-side-item--parent"
                  :class="{'is-active': curType() === 'chat' && !selectedAgentBotId}"
                  x-press="go('/home/section?type=chat')">
            {{sideIcon "bot"}}
            <span class="home-side-label">Bots</span>
            <span class="home-side-chevron is-open" :class="{'is-open': chatsOpen}" x-show="!botsEmpty()" {{xshow (gt (len .Boot.Bots) 0)}} @pointerdown.stop @click.stop="chatsOpen = !chatsOpen">{{icon "chevron-right"}}</span>
          </button>
          {{/* Open with the boot's row count reserved, so nothing below moves when the rows render. */}}
          <div class="home-side-children{{if .Boot.Bots}} is-open{{end}}" id="home-side-chats-body" :class="{'is-open': chatsOpen && !botsEmpty()}"
               {{if .Boot.Bots}}data-reserve style="--reserve-rows: {{len .Boot.Bots}}"{{end}}
               x-init="$nextTick(() => $el.removeAttribute('data-reserve'))">
            <div class="home-side-children-inner">
              <template x-for="m in agentBots" :key="m.id">
                <button type="button" class="side-nav-item home-side-child" :class="{'is-active': curType() === 'chat' && selectedAgentBotId === m.id}"
                        x-press="selectChatAgentBot(m.id)">
                  <span class="avatar avatar--sm home-side-child-avatar"
                        x-html="agentBotAvatar(m.name)"></span>
                  <span class="home-side-child-name" x-text="m.name"></span>
                </button>
              </template>
            </div>
          </div>
        </div>

        <div class="home-side-group">
          <button type="button" class="side-nav-item home-side-item home-side-item--parent"
                  :class="{'is-active': sideEmpty.knowledge && curType() === 'knowledge'}"
                  x-press="sideEmpty.knowledge ? selectKnowledgeIndex('') : (knowledgeOpen = !knowledgeOpen)">
            {{sideIcon "knowledge"}}
            <span class="home-side-label">Knowledge</span>
            <span class="home-side-chevron" :class="{'is-open': knowledgeOpen}" x-show="!sideEmpty.knowledge" {{xshow .HasKnowledge}}>{{icon "chevron-right"}}</span>
          </button>
          <div class="home-side-children" id="home-side-knowledge-body" x-bind:class="{'is-open': knowledgeOpen && !sideEmpty.knowledge}">
            <div class="home-side-children-inner">
{{template "home-side-knowledge-inner" .}}
            </div>
          </div>
        </div>

        <button type="button" class="side-nav-item home-side-item"
                :class="{'is-active': curType() === 'tags'}"
                x-press="go('/home/section?type=tags')">
          {{sideIcon "tags"}}
          <span class="home-side-label">Tags</span>
        </button>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': curType() === 'memory'}"
                x-press="go('/home/section?type=memory')">
          {{sideIcon "memory"}}
          <span class="home-side-label">Memory</span>
        </button>

        <div class="home-side-sep hairline"></div>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': curType() === 'pinned'}"
                x-press="go('/home/section?type=pinned')">
          {{sideIcon "pinned"}}
          <span class="home-side-label">Pinned</span>
        </button>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': curType() === 'recent'}"
                x-press="go('/home/section?type=recent')">
          {{sideIcon "recent"}}
          <span class="home-side-label">Recent</span>
        </button>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': curType() === 'shorts'}"
                x-press="go('/home/section?type=shorts')">
          {{sideIcon "shorts"}}
          <span class="home-side-label">Shorts</span>
        </button>

        <button type="button" class="side-nav-item home-side-item" :class="{'is-active': curType() === 'images'}"
                x-press="go('/home/section?type=images')">
          {{sideIcon "images"}}
          <span class="home-side-label">Images</span>
        </button>

        <div class="home-side-group">
          <button type="button" class="side-nav-item home-side-item home-side-item--parent"
                  :class="{'is-active': sideEmpty.folders && curType() === 'folder'}"
                  x-press="sideEmpty.folders ? go('/home/section?type=folder&path=%2F') : (foldersOpen = !foldersOpen)">
            {{sideIcon "folders"}}
            <span class="home-side-label">Folders</span>
            <span class="home-side-chevron" :class="{'is-open': foldersOpen}" x-show="!sideEmpty.folders" {{xshow .HasFolders}}>{{icon "chevron-right"}}</span>
          </button>
          <div class="home-side-children" id="home-side-folders-body" x-bind:class="{'is-open': foldersOpen && !sideEmpty.folders}">
            <div class="home-side-children-inner">
{{template "home-side-folders-inner" .}}
            </div>
          </div>
        </div>

      </nav>

      <div class="home-side-bottom">
        <div class="cselect cselect--inline server-switcher" x-data="{open:false}" x-show="$store.servers.available" x-cloak
             x-init="$store.servers.load()" @click.outside="open=false" @keydown.escape="open=false">
          <button type="button" class="cselect-btn cselect-btn--ghost" :class="{open:open}" aria-label="Switch server"
                  @click="open = !open; if (open) $store.servers.refresh()">
            <span class="srv-dot" :class="'is-' + $store.servers.state($store.servers.activeId)"></span>
            <span class="cselect-btn-text" x-text="$store.servers.active() ? $store.servers.active().name : 'Server'"></span>
            {{icon "chevron-down"}}
          </button>
          <div class="cselect-dropdown" x-show="open" x-cloak>
            <template x-for="s in $store.servers.items" :key="s.id">
              <button type="button" class="cselect-option" :class="{sel: s.active}"
                      @click="open = false; window.dispatchEvent(new CustomEvent('hylo:switch-server', {detail: {id: s.id}}))">
                <span class="srv-dot" :class="'is-' + $store.servers.state(s.id)"></span>
                <span class="srv-option-main">
                  <span class="srv-option-name" x-text="s.name"></span>
                  <span class="srv-option-url" x-text="s.kind === 'local' ? 'This computer' : $store.servers.host(s.url)"></span>
                </span>
              </button>
            </template>
            <div class="cselect-divider hairline"></div>
            <button type="button" class="cselect-option" @click="open = false; $store.servers.openManager()">
              <span>Manage servers…</span>
            </button>
          </div>
        </div>
        <button type="button" class="icon-btn-ghost home-side-bottom-btn" title="Settings"
                @click="$store.settingsModal.open = true; $el.blur()">
          {{icon "settings"}}
        </button>
      </div>
    </aside>

    <!-- Common parent for everything right of the sidebar (mirrors .home-side);
         closed in home.go once content_pane.html's markup is spliced in. -->
    <div class="home-main">
      <main class="home-list-pane" id="home-list-pane" hx-sync="this:replace">
        {{.SectionHTML}}
      </main>

      <div class="home-pane-resizer" id="home-pane-resizer"
           @mousedown="startPaneResize($event)"
           title="Drag to resize"></div>
{{template "content_pane.html" .}}
    </div><!-- /.home-main -->
  </div><!-- /.home-shell -->
</div><!-- /.home-container -->
