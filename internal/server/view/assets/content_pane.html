  <div class="content-pane"
       :class="{ open: contentPaneOpen || inboxSheetOpen }"
       @close-content-pane.document="closeContentPane()">
    <!-- Shared with the inbox message detail below — only one of the two
         is ever visible (contentPaneOpen/inboxSheetOpen watchers), so both
         ride the same split motion. -->
    <div class="content-pane-panel" x-show="!inboxSheetOpen">

      <!-- ① Tool bar: maximize | note title | note actions -->
      <div class="content-pane-tool-bar" :inert="agentWriting">
        <!-- Maximize/restore — unconditional (doesn't depend on create vs
             edit mode below), same spot/icon the old tab bar's own button
             used. -->
        <button type="button" class="icon-btn-ghost content-pane-expand-btn"
                @click.stop="toggleMaximizeEditor(); $el.blur()"
                :title="(splitRatio <= 0.02 ? 'Restore split' : 'Maximize editor') + ' (' + (isMac ? '⌘\\' : 'Ctrl+\\') + ')'">
          <!-- maximize: corners pointing outward -->
          <svg x-show="splitRatio > 0.02" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9V5h4"/><path d="M20 9V5h-4"/>
            <path d="M4 15v4h4"/><path d="M20 15v4h-4"/>
          </svg>
          <!-- restore: corners pointing inward -->
          <svg x-show="splitRatio <= 0.02" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5v4H5"/><path d="M15 5v4h4"/>
            <path d="M9 19v-4H5"/><path d="M15 19v-4h4"/>
          </svg>
        </button>
        <!-- Open tabs live in the sidebar (home.html); the header names the active note. -->
        <div class="content-pane-title" x-show="activeTab >= 0" :title="tabs[activeTab] && tabs[activeTab].path || 'Untitled'">
          <span class="note-draft-icon" x-show="tabs[activeTab] && !tabs[activeTab].path" aria-hidden="true">{{icon "draft"}}</span>
          <span class="content-pane-title-dir" x-show="!renaming && activeTabDir()" x-text="activeTabDir()"></span>
          <span class="content-pane-title-sep" x-show="!renaming && activeTabDir()" aria-hidden="true">/</span>
          <span class="content-pane-title-name" x-show="!renaming"
                @dblclick="tabs[activeTab] && tabs[activeTab].path && renameActiveNote()"
                x-text="tabs[activeTab] ? tabs[activeTab].title : ''"></span>
          <input type="text" id="content-pane-rename-input" class="content-pane-rename-input hairline"
                 x-show="renaming" x-cloak
                 @input="checkRenameNameAvailable()"
                 @keydown.enter="submitRenameActiveNote()"
                 @keydown.escape="cancelRenameActiveNote()"
                 @blur="submitRenameActiveNote()" />
          <span id="content-pane-save-status" class="content-pane-save-status">
            <svg class="ssi-pending" width="8" height="8" viewBox="0 0 8 8" fill="currentColor">
              <circle cx="4" cy="4" r="3.5"/>
            </svg>
            <svg class="ssi-saved" width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 7l4 4 6-6"/>
            </svg>
          </span>
        </div>
        <div class="content-pane-tool-actions" x-show="activeTab >= 0">
          <button type="button" class="icon-btn-ghost content-pane-reading-btn"
                  @click.stop="editorMode.toggleReading()"
                  :title="'Reading view (' + (isMac ? '⌘L' : 'Ctrl+L') + ')'">
            <!-- lucide "book-open" -->
            <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M12 7v14"/>
              <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
            </svg>
          </button>
          <div class="content-pane-bot-wrap" x-data="{ botMenuOpen: false }"
               x-show="tabs[activeTab] && tabs[activeTab].path"
               @mousedown.outside="botMenuOpen = false"
               @content-pane:close-bot.document="botMenuOpen = false">
            <button type="button" class="icon-btn-ghost content-pane-bot-btn"
                    @click.stop="botMenuOpen = !botMenuOpen"
                    :class="{ active: botMenuOpen }"
                    title="Send to bot">
              <!-- lucide "send" -->
              <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
                <path d="m21.854 2.147-10.94 10.939"/>
              </svg>
            </button>
            <div class="content-pane-bot-menu" x-show="botMenuOpen" x-cloak
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 -translate-y-2 scale-[0.97]"
                 x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                 x-transition:leave-end="opacity-0 -translate-y-1 scale-[0.98]">
              <div class="content-pane-bot-menu-header">
                <span class="content-pane-bot-menu-header-label">Send to bot</span>
              </div>
              <div class="content-pane-bot-menu-list">
                <template x-for="m in (window._homeData ? window._homeData.agentBots : [])" :key="m.id">
                  <button type="button" class="content-pane-bot-menu-row"
                          @click.stop="botMenuOpen = false; sendActiveNoteToAgentBot(m.id)"
                          :title="m.name">
                    <span class="avatar avatar--sm content-pane-bot-menu-avatar"
                          x-html="window._homeData.agentBotAvatar(m.name)"></span>
                    <span class="content-pane-bot-menu-name" x-text="m.name"></span>
                  </button>
                </template>
                <div class="content-pane-bot-menu-empty" x-show="!window._homeData || window._homeData.agentBots.length === 0">No bots yet</div>
              </div>
            </div>
          </div>
          <div class="content-pane-more-wrap" x-data="{ moreOpen: false, copied: false, view: 'menu', info: null, infoSeq: 0, dirCopied: false,
                        openInfo() {
                          const seq = ++this.infoSeq;
                          this.info = __hyloEditorInfo(null); this.view = 'info';
                          if (!this.info.path) return;
                          __hyloEditorFetchNoteMeta(this.info.path).then(m => { if (seq === this.infoSeq && m) this.info = __hyloEditorInfo(m); });
                        },
                        copyDir() {
                          __hyloEditorCopyText(this.info.dir).then(ok => { if (!ok) return; this.dirCopied = true; setTimeout(() => this.dirCopied = false, 900); });
                        } }"
               x-init="$watch('moreOpen', o => { if (o) { view = 'menu'; info = null; dirCopied = false; } })"
               @mousedown.outside="moreOpen = false"
               @content-pane:close-more.document="moreOpen = false">
            <button type="button" class="icon-btn-ghost content-pane-more-btn"
                    @click.stop="moreOpen = !moreOpen"
                    :class="{ active: moreOpen }"
                    title="More actions">
              <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                <circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/>
              </svg>
            </button>
            <div class="content-pane-more-menu" x-show="moreOpen" x-cloak
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 -translate-y-2 scale-[0.97]"
                 x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                 x-transition:leave-end="opacity-0 -translate-y-1 scale-[0.98]">
              <div x-show="view === 'menu'">
              <button type="button" class="content-pane-more-item content-pane-find-btn"
                      @click.stop="moreOpen = false; __hyloEditorOpenFind()"
                      :title="'Find (' + (isMac ? '⌘F' : 'Ctrl+F') + ')'">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.34-4.34"/>
                </svg>
                <span>Find</span>
                <span class="content-pane-more-item-kbd kbd-combo" x-html="hyloKbdHTML(isMac ? '⌘F' : 'Ctrl+F')"></span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-source-toggle-btn"
                      @click.stop="moreOpen = false; editorMode.toggle()"
                      title="Toggle raw markdown">
                <!-- Each pair (icon+label) names the mode a click will switch TO. -->
                <svg class="dstb-goto-source" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m18 16 4-4-4-4"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="m6 8-4 4 4 4"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="m14.5 4-5 16"/>
                </svg>
                <span class="dstb-goto-source">Raw markdown</span>
                <svg class="dstb-goto-wysiwyg" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <span class="dstb-goto-wysiwyg">Live preview</span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-copy-btn"
                      @click.stop="__hyloEditorCopyMarkdown().then(ok => { if (!ok) { moreOpen = false; return; } copied = true; setTimeout(() => { copied = false; moreOpen = false; }, 900); })"
                      title="Copy note as markdown">
                <svg x-show="!copied" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                </svg>
                <svg x-show="copied" x-cloak fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M20 6 9 17l-5-5"/>
                </svg>
                <span class="content-pane-copy-label">
                  <span :class="{ 'is-hidden': copied }">Copy markdown</span>
                  <span :class="{ 'is-hidden': !copied }">Copied</span>
                </span>
              </button>
              <button type="button" class="content-pane-more-item frag-pin-btn"
                      :class="{ active: tabs[activeTab] && tabs[activeTab].pinned }"
                      x-show="tabs[activeTab] && tabs[activeTab].path"
                      @click.stop="moreOpen = false; togglePinActiveNote()"
                      :title="tabs[activeTab] && tabs[activeTab].pinned ? 'Unpin note' : 'Pin note'">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/>
                </svg>
                <span x-text="tabs[activeTab] && tabs[activeTab].pinned ? 'Unpin' : 'Pin'"></span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-compile-btn"
                      x-show="tabs[activeTab] && tabs[activeTab].canCompile"
                      @click.stop="compileContentPaneNote($event)"
                      title="Compile to knowledge note">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8 19 13"/><path d="M15 9h.01"/><path d="M17.8 6.2 19 5"/><path d="m3 21 9-9"/><path d="M12.2 6.2 11 5"/>
                </svg>
                <span class="content-pane-compile-label">Compile</span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-rename-btn"
                      x-show="tabs[activeTab] && tabs[activeTab].path"
                      @click.stop="moreOpen = false; renameActiveNote()"
                      title="Rename note">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                  <path d="m15 5 4 4"/>
                </svg>
                <span>Rename</span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-more-item-danger"
                      @click.stop="moreOpen = false; deleteActiveNote()">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path stroke-linecap="round" stroke-linejoin="round" d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path stroke-linecap="round" stroke-linejoin="round" d="M10 11v6"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 11v6"/>
                </svg>
                Delete
              </button>
              <button type="button" class="content-pane-more-item content-pane-info-btn"
                      x-show="tabs[activeTab] && tabs[activeTab].path"
                      @click.stop="openInfo()"
                      title="Note info">
                <!-- lucide "info" -->
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
                </svg>
                <span>Info</span>
              </button>
              <div class="content-pane-more-divider hairline" role="separator"></div>
              <!-- Not a feature — mousedown-outside/Esc/picking any row above
                   already dismisses the menu; this just gives mouse-only
                   users the same escape hatch, so it's set apart by the
                   divider and stays visually quiet (content_pane.css). -->
              <button type="button" class="content-pane-more-item content-pane-more-item-close"
                      @click.stop="moreOpen = false">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                </svg>
                <span>Close</span>
                <span class="content-pane-more-item-kbd">Esc</span>
              </button>
              </div>
              <div class="content-pane-info" x-show="view === 'info'" x-cloak>
                <button type="button" class="content-pane-more-item content-pane-info-head"
                        @click.stop="view = 'menu'">
                  <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="m15 18-6-6 6-6"/>
                  </svg>
                  <span>Info</span>
                </button>
                <div class="content-pane-more-divider hairline" role="separator"></div>
                <div class="content-pane-info-body" x-show="info">
                  <div class="content-pane-info-row">
                    <span class="content-pane-info-label">Folder</span>
                    <button type="button" class="content-pane-info-value content-pane-info-copy"
                            @click.stop="copyDir()" :title="info && info.dir"
                            x-text="dirCopied ? 'Copied' : (info && info.dir)"></button>
                  </div>
                  <div class="content-pane-info-row">
                    <span class="content-pane-info-label">Words</span>
                    <span class="content-pane-info-value" x-text="info && info.words"></span>
                  </div>
                  <div class="content-pane-info-row">
                    <span class="content-pane-info-label">Lines</span>
                    <span class="content-pane-info-value" x-text="info && info.lines"></span>
                  </div>
                  <div class="content-pane-info-row">
                    <span class="content-pane-info-label">Created</span>
                    <span class="content-pane-info-value" x-text="info && info.created"></span>
                  </div>
                  <div class="content-pane-info-row">
                    <span class="content-pane-info-label">Modified</span>
                    <span class="content-pane-info-value" x-text="info && info.modified"></span>
                  </div>
                  <div x-show="info && info.linksLabel">
                    <div class="content-pane-more-divider hairline" role="separator"></div>
                    <div class="content-pane-info-row">
                      <span class="content-pane-info-label" x-text="info && info.linksLabel"></span>
                      <span class="content-pane-info-value" x-show="info && info.linkCount" x-text="info && info.linkCount"></span>
                    </div>
                    <template x-for="l in (info ? info.links : [])" :key="l.path">
                      <button type="button" class="content-pane-more-item content-pane-info-link"
                              @click.stop="moreOpen = false; __hyloContentPane.openNoteInContentPane(l.path, l.title, info.linksAreKnowledge, false)"
                              :title="l.path">
                        <span x-text="l.title"></span>
                      </button>
                    </template>
                    <div class="content-pane-info-more" x-show="info && info.linksMore"
                         x-text="info && ('+' + info.linksMore + ' more')"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button type="button" class="icon-btn-ghost content-pane-close-btn"
                @click.stop="closeContentPane()"
                title="Close">
          <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>

      <!-- ③ Editor area — single CodeMirror 6 view; editorMode.enterSource/
           exitSource toggle live-preview decorations on/off in place, and
           note/tab switches swap in a fresh EditorState via view.setState()
           (see content_pane.js) rather than mounting a separate editor. -->
      <div id="content-pane-edit-area" tabindex="-1"></div>
    </div>

    <!-- Inbox message detail — read-only, distinct from the note editor
         above but sharing this same pane (see the comment on
         .content-pane). Entirely driven by homeCtrl's inboxSelected/
         inboxSheetOpen (home.js's selectInboxMessage/closeInboxSheet). -->
    <div class="content-pane-panel inbox-detail-panel" x-show="inboxSheetOpen">
      <div class="content-pane-tool-bar">
        <button type="button" class="icon-btn-ghost inbox-sheet-close" @click="closeInboxSheet()" title="Close">
          <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" d="M18 6 6 18"/><path stroke-linecap="round" d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="inbox-sheet-scroll">
        <div class="inbox-sheet-column">
          <div class="inbox-sheet-sender">
            <span class="avatar avatar--lg" x-html="inboxSelected ? agentBotAvatar(inboxSelected.source) : ''"></span>
            <div class="inbox-sheet-sender-text">
              <span class="inbox-sheet-sender-name" x-text="inboxSelected ? inboxSelected.source : ''"></span>
              <span class="inbox-sheet-sender-time" x-text="inboxSelected ? fullTime(inboxSelected.createdAt) : ''"></span>
            </div>
          </div>
          <div class="inbox-sheet-divider hairline" role="separator"></div>
          <div class="prose inbox-sheet-body" x-html="inboxSelected ? __hyloRenderMarkdown(inboxSelected.body) : ''"
               x-effect="inboxSelected; $nextTick(() => __hyloHydrateFenceCards($el))"></div>
        </div>
      </div>
    </div>
  </div>
