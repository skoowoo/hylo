  <div class="content-pane"
       :class="{ open: contentPaneOpen || inboxSheetOpen }"
       @close-content-pane.document="contentPaneOpen = false">
    <!-- This pane is shared with the inbox message detail below — only one
         of the two is ever visible (mutual exclusion lives in
         homeCtrl/contentPaneCtrl's contentPaneOpen/inboxSheetOpen watchers, home.js/
         content_pane.js), so both reuse the same .content-pane-panel slide/fade
         choreography (content_pane.css) instead of each animating on its own. -->
    <div class="content-pane-panel" x-show="!inboxSheetOpen">

      <!-- ① Tool bar: maximize | tab strip (+ overflow) | note actions -->
      <div class="content-pane-tool-bar">
        <!-- Maximize/restore — unconditional (doesn't depend on create vs
             edit mode below), same spot/icon the old tab bar's own button
             used. -->
        <button type="button" class="icon-btn-ghost content-pane-expand-btn"
                @click.stop="toggleMaximizeEditor(); $el.blur()"
                :title="(splitRatio <= 0.02 ? 'Restore split' : 'Maximize editor') + ' (' + (isMac ? '⌘\\' : 'Ctrl+\\') + ')'">
          <!-- maximize: corners pointing outward -->
          <svg x-show="splitRatio > 0.02" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9V5h4"/><path d="M20 9V5h-4"/>
            <path d="M4 15v4h4"/><path d="M20 15v4h-4"/>
          </svg>
          <!-- restore: corners pointing inward -->
          <svg x-show="splitRatio <= 0.02" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5v4H5"/><path d="M15 5v4h4"/>
            <path d="M9 19v-4H5"/><path d="M15 19v-4h4"/>
          </svg>
        </button>
        <!-- Header tab strip: real per-tab chips instead of a single path
             label. tabs' first tabVisibleCount entries are the visible
             window, kept in stable (open-order) position by _activateTab
             (content_pane.js) — switching among tabs already shown never
             reorders them; only a tab arriving from the hidden/MRU tail
             evicts one (the longest-untouched visible tab) to make room.
             So the active tab can be anywhere in this loop, not just i=0 —
             template bindings below compare against activeTab directly.
             Each chip's width hugs its own title (content_pane.css's
             --cp-tab-min-w/--cp-tab-max-w). How many fit is computed once
             from off-row measurements (initTabstrip), then committed. -->
        <div class="content-pane-tabstrip" id="content-pane-tabstrip"
             x-show="activeTab >= 0" x-init="initTabstrip($el)">
          <!-- x-data stays on this wrap, not the tabstrip: x-init above has
               to run against the pane controller. The menu is a sibling of
               the clip row so overflow:hidden doesn't trap it. -->
          <div class="content-pane-tabs-wrap" id="content-pane-tabs-wrap"
               x-data="{
                 tabsMenuOpen: false, tabsMenuActiveIndex: -1,
                 toggleTabsMenu() { this.tabsMenuOpen = !this.tabsMenuOpen; this.tabsMenuActiveIndex = this.tabsMenuOpen ? activeTab : -1; },
               }"
               @mousedown.outside="tabsMenuOpen = false"
               @content-pane:close-tabs.document="tabsMenuOpen = false">
          <div class="content-pane-tabstrip-row" id="content-pane-tabstrip-row">
          <template x-for="(tab, i) in visibleTabs()" :key="tab.id">
            <!-- No x-transition:enter here — Alpine only plays a
                 transition directive's enter/leave when something toggles
                 via x-show/x-if; a plain x-for insertion just splices the
                 node straight into the DOM with no hook into that
                 machinery, so those attributes would be silently inert.
                 Chips that slide (a close, or a tab promoted in from the
                 overflow tail) are moved by content_pane.js's _flipApply.
                 A chip entering the window fades via .is-entering, which
                 has to be on its first paint — a later opacity write
                 flashes it solid.
                 A tab leaving the visible set (closed, or evicted to the
                 hidden tail) isn't animated out at all, on purpose — that
                 would hold its flex slot open for the transition's
                 length and delay the *other* tabs' slide into filling
                 the gap, turning one clean motion into two staggered
                 ones. The slide itself already reads as "something
                 left". -->
            <div class="content-pane-tab" :data-tab-id="tab.id"
                 :class="{ active: i === activeTab, 'is-entering': tabEntering[tab.id] }"
                 :title="tab.path || 'Untitled'"
                 @click="tabsMenuOpen = false; i !== activeTab && contentPaneSwitchTab(i)">
              <span class="content-pane-tab-draft-icon" x-show="!tab.path" aria-hidden="true">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 20h9"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                </svg>
              </span>
              <!-- Only the active tab can ever be dirty — one CodeMirror
                   instance edits one tab at a time, and switching away
                   flushes it first (contentPaneSwitchTab) — so this is the
                   one chip that ever needs #content-pane-save-status, not
                   one copy per chip (that'd be a duplicate-id DOM). Visible
                   tabs keep a stable position now (_activateTab), so the
                   active one isn't reliably i===0 any more — compare
                   against activeTab directly, same as the dropdown below
                   already does.

                   The slot itself (not just its content) stays in every
                   chip regardless of active state — mounting/unmounting
                   #content-pane-save-status only when a tab becomes active
                   used to change that chip's width by the icon's own size,
                   which read as every tab jittering wider/narrower on each
                   switch (content_pane.css's fixed slot width). -->
              <span class="content-pane-tab-status-slot">
                <template x-if="i === activeTab">
                  <span id="content-pane-save-status" class="content-pane-save-status">
                    <svg class="ssi-pending" width="8" height="8" viewBox="0 0 8 8" fill="currentColor">
                      <circle cx="4" cy="4" r="3.5"/>
                    </svg>
                    <svg class="ssi-saved" width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M2 7l4 4 6-6"/>
                    </svg>
                  </span>
                </template>
              </span>
              <span class="content-pane-tab-title" x-show="!(i === activeTab && renaming)"
                    @dblclick="i === activeTab && tab.path && renameActiveNote()" x-text="tab.title"></span>
              <!-- Renaming only ever targets the active tab — same slot the
                   title span above occupies, swapped in instead of it. -->
              <template x-if="i === activeTab">
                <input type="text" id="content-pane-rename-input" class="content-pane-rename-input"
                       x-show="renaming" x-cloak
                       @click.stop
                       @input="checkRenameNameAvailable()"
                       @keydown.enter="submitRenameActiveNote()"
                       @keydown.escape="cancelRenameActiveNote()"
                       @blur="submitRenameActiveNote()" />
              </template>
              <button type="button" class="content-pane-tab-close"
                      @click.stop="contentPaneCloseTab(i)" title="Close tab">
                <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" d="M18 6 6 18"/>
                  <path stroke-linecap="round" d="m6 6 12 12"/>
                </svg>
              </button>
            </div>
          </template>
          <!-- Always mounted as a lookup target for Cmd/Ctrl+T
               (__vaultrContentPaneTabsMenuScope), even with nothing hidden.
               The "+N" button itself is overflow-only and has no
               enter/leave transition — a leave would keep it in the flex
               row after the count changed and shove the last chip. -->
            <button type="button" class="content-pane-tabs-overflow"
                    x-show="hiddenTabCount() > 0"
                    @click.stop="toggleTabsMenu()"
                    :class="{ active: tabsMenuOpen }"
                    :title="'Open tabs (' + (isMac ? '⌘T' : 'Ctrl+T') + ')'">
              <span x-text="'+' + hiddenTabCount()"></span>
              <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>
          </div>
            <div class="content-pane-tabs-menu" x-show="tabsMenuOpen" x-cloak
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 -translate-y-2 scale-[0.97]"
                 x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                 x-transition:leave-end="opacity-0 -translate-y-1 scale-[0.98]">
              <div class="content-pane-tabs-menu-header">
                <span class="content-pane-tabs-menu-header-label">Open tabs</span>
                <span class="content-pane-tabs-menu-header-hint" x-show="tabs.length > 1">↑↓ Enter</span>
              </div>
              <div class="content-pane-tabs-menu-list">
                <template x-for="(tab, i) in tabs" :key="tab.id">
                  <!-- active compares tab.id, not the loop index i, against
                       the active tab's id — comparing against i directly
                       went stale on the row Alpine reused/moved during a
                       reorder (_activateTab splices tabs around on
                       eviction/promotion — content_pane.js): tab-scoped
                       bindings (x-text, :title) tracked the move fine, but
                       the outer-scope activeTab === i comparison didn't get
                       re-evaluated on that node. -->
                  <div class="content-pane-tabs-menu-row" :class="{active: tab.id === (tabs[activeTab] && tabs[activeTab].id), 'kbd-active': tabsMenuActiveIndex === i}"
                       @click.stop="contentPaneSwitchTab(i); tabsMenuOpen = false" :title="tab.title">
                    <!-- Shape/color from the shared .dot/.dot--accent (base.css); only
                         the hidden-until-active visibility is local (content_pane.css). -->
                    <span class="dot dot--accent content-pane-tabs-menu-dot" aria-hidden="true"></span>
                    <span class="content-pane-tabs-menu-title" x-text="tab.title"></span>
                    <span class="content-pane-tab-draft-icon" x-show="!tab.path" title="New — not saved yet" aria-hidden="true">
                      <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 20h9"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                      </svg>
                    </span>
                    <button type="button" class="content-pane-tabs-menu-close"
                            @click.stop="contentPaneCloseTab(i)"
                            title="Close tab">
                      <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" style="width:10px;height:10px">
                        <path stroke-linecap="round" d="M18 6 6 18"/>
                        <path stroke-linecap="round" d="m6 6 12 12"/>
                      </svg>
                    </button>
                  </div>
                </template>
                <div class="content-pane-tabs-menu-empty" x-show="tabs.length === 0">No open tabs</div>
              </div>
              <div class="content-pane-more-divider" role="separator"></div>
              <!-- Not a feature — mousedown-outside/Esc/picking a tab above
                   already dismisses this menu; same convenience row as the
                   more menu's Close (content_pane.css reuses its classes
                   here rather than restyling one from scratch). -->
              <button type="button" class="content-pane-more-item content-pane-more-item-close"
                      @click.stop="tabsMenuOpen = false">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                </svg>
                <span>Close</span>
                <span class="content-pane-more-item-kbd">Esc</span>
              </button>
            </div>
          </div>
        </div>
        <div class="content-pane-tool-actions" x-show="activeTab >= 0">
          <button type="button" class="icon-btn-ghost content-pane-reading-btn"
                  @click.stop="editorMode.toggleReading()"
                  :title="'Reading view (' + (isMac ? '⌘L' : 'Ctrl+L') + ')'">
            <!-- lucide "book-open" -->
            <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M12 7v14"/>
              <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
            </svg>
          </button>
          <div class="content-pane-more-wrap" x-data="{ moreOpen: false, copied: false }"
               @mousedown.outside="moreOpen = false"
               @content-pane:close-more.document="moreOpen = false">
            <button type="button" class="icon-btn-ghost content-pane-more-btn"
                    @click.stop="moreOpen = !moreOpen"
                    :class="{ active: moreOpen }"
                    title="More actions">
              <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                <circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/>
              </svg>
            </button>
            <div class="content-pane-more-menu" x-show="moreOpen" x-cloak
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 -translate-y-2 scale-[0.97]"
                 x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                 x-transition:leave-end="opacity-0 -translate-y-1 scale-[0.98]">
              <button type="button" class="content-pane-more-item content-pane-find-btn"
                      @click.stop="moreOpen = false; __vaultrEditorOpenFind()"
                      :title="'Find (' + (isMac ? '⌘F' : 'Ctrl+F') + ')'">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.34-4.34"/>
                </svg>
                <span>Find</span>
                <span class="content-pane-more-item-kbd kbd-combo" x-html="vaultrKbdHTML(isMac ? '⌘F' : 'Ctrl+F')"></span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-source-toggle-btn"
                      @click.stop="moreOpen = false; editorMode.toggle()"
                      title="Toggle raw markdown">
                <!-- Each pair (icon+label) names the mode a click will switch TO. -->
                <svg class="dstb-goto-source" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m18 16 4-4-4-4"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="m6 8-4 4 4 4"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="m14.5 4-5 16"/>
                </svg>
                <span class="dstb-goto-source">Raw markdown</span>
                <svg class="dstb-goto-wysiwyg" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <span class="dstb-goto-wysiwyg">Live preview</span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-copy-btn"
                      @click.stop="__vaultrEditorCopyMarkdown().then(ok => { if (!ok) { moreOpen = false; return; } copied = true; setTimeout(() => { copied = false; moreOpen = false; }, 900); })"
                      title="Copy note as markdown">
                <svg x-show="!copied" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                </svg>
                <svg x-show="copied" x-cloak fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M20 6 9 17l-5-5"/>
                </svg>
                <span class="content-pane-copy-label">
                  <span :class="{ 'is-hidden': copied }">Copy markdown</span>
                  <span :class="{ 'is-hidden': !copied }">Copied</span>
                </span>
              </button>
              <button type="button" class="content-pane-more-item frag-pin-btn"
                      :class="{ active: tabs[activeTab] && tabs[activeTab].pinned }"
                      x-show="tabs[activeTab] && tabs[activeTab].path"
                      @click.stop="moreOpen = false; togglePinActiveNote()"
                      :title="tabs[activeTab] && tabs[activeTab].pinned ? 'Unpin note' : 'Pin note'">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/>
                </svg>
                <span x-text="tabs[activeTab] && tabs[activeTab].pinned ? 'Unpin' : 'Pin'"></span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-compile-btn"
                      x-show="tabs[activeTab] && tabs[activeTab].canCompile"
                      @click.stop="compileContentPaneNote($event)"
                      title="Compile to knowledge note">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8 19 13"/><path d="M15 9h.01"/><path d="M17.8 6.2 19 5"/><path d="m3 21 9-9"/><path d="M12.2 6.2 11 5"/>
                </svg>
                <span class="content-pane-compile-label">Compile</span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-rename-btn"
                      x-show="tabs[activeTab] && tabs[activeTab].path"
                      @click.stop="moreOpen = false; renameActiveNote()"
                      title="Rename note">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                  <path d="m15 5 4 4"/>
                </svg>
                <span>Rename</span>
              </button>
              <button type="button" class="content-pane-more-item content-pane-more-item-danger"
                      @click.stop="moreOpen = false; deleteActiveNote()">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path stroke-linecap="round" stroke-linejoin="round" d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path stroke-linecap="round" stroke-linejoin="round" d="M10 11v6"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 11v6"/>
                </svg>
                Delete
              </button>
              <div class="content-pane-more-divider" role="separator"></div>
              <!-- Not a feature — mousedown-outside/Esc/picking any row above
                   already dismisses the menu; this just gives mouse-only
                   users the same escape hatch, so it's set apart by the
                   divider and stays visually quiet (content_pane.css). -->
              <button type="button" class="content-pane-more-item content-pane-more-item-close"
                      @click.stop="moreOpen = false">
                <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                </svg>
                <span>Close</span>
                <span class="content-pane-more-item-kbd">Esc</span>
              </button>
            </div>
          </div>
        </div>
        <button type="button" class="icon-btn-ghost content-pane-close-btn"
                @click.stop="contentPaneOpen = false"
                title="Close">
          <svg fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>

      <!-- ③ Editor area — single CodeMirror 6 view; editorMode.enterSource/
           exitSource toggle live-preview decorations on/off in place, and
           note/tab switches swap in a fresh EditorState via view.setState()
           (see content_pane.js) rather than mounting a separate editor. -->
      <div id="content-pane-edit-area" tabindex="-1"></div>
    </div>

    <!-- Inbox message detail — read-only, distinct from the note editor
         above but sharing this same pane (see the comment on
         .content-pane). Entirely driven by homeCtrl's inboxSelected/
         inboxSheetOpen (home.js's selectInboxMessage/closeInboxSheet). -->
    <div class="content-pane-panel inbox-detail-panel" x-show="inboxSheetOpen">
      <div class="content-pane-tool-bar">
        <span class="inbox-sheet-title" x-text="inboxSelected ? (inboxSelected.title || inboxSelected.source) : ''"></span>
        <button type="button" class="icon-btn-ghost inbox-sheet-close" @click="closeInboxSheet()" title="Close">
          <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" d="M18 6 6 18"/><path stroke-linecap="round" d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="inbox-sheet-meta">
        <span x-text="inboxSelected ? inboxSelected.source : ''"></span>
        <span>·</span>
        <span x-text="inboxSelected ? fullTime(inboxSelected.createdAt) : ''"></span>
      </div>
      <div class="inbox-sheet-scroll">
        <div class="prose inbox-sheet-body" x-html="inboxSelected ? renderMarkdown(inboxSelected.body) : ''"></div>
      </div>
    </div>
  </div>
