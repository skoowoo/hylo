{{define "shorts-days"}}{{range .Groups}}{{$group := .}}
<div class="shorts-day" data-day="{{.Day}}">
  {{range .Entries}}
  <article class="list-card shorts-entry{{if .Images}} shorts-entry--media{{end}}{{if .Quote}} shorts-entry--quote{{end}}"
           data-id="{{.ID}}" data-hash="{{.Hash}}" data-path="{{.Path}}" data-stamp="{{.Stamp}}"
           x-data="{ more: false }" :class="{ 'is-menu-open': more }">
    <div class="shorts-entry-meta">
      <button type="button" class="shorts-entry-date" title="Open the daily note"
              @click="openShortDay($el.closest('.shorts-entry'))">{{if $group.IsToday}}Today{{else if $group.IsYesterday}}Yesterday{{else}}{{$group.DateLabel}}{{end}}</button>
      <span class="shorts-entry-time">{{.Time}}</span>
    </div>
    <div class="shorts-entry-actions">
      <button type="button" class="icon-btn-ghost icon-btn-ghost--sm" title="Edit" aria-label="Edit"
              @click="editShort($el.closest('.shorts-entry'))">{{icon "pencil"}}</button>
      <div class="cselect cselect--inline" @click.outside="more = false">
        <button type="button" class="icon-btn-ghost icon-btn-ghost--sm shorts-entry-more" :class="{ active: more }" title="More" aria-label="More"
                @click="more = !more" @keydown.escape="more = false">{{icon "more"}}</button>
        <div class="cselect-dropdown" x-show="more" x-cloak>
          <button type="button" class="cselect-option" @click="more = false; copyShort($el.closest('.shorts-entry'))">{{icon "copy"}}<span>Copy text</span></button>
          <button type="button" class="cselect-option" @click="more = false; openShortDay($el.closest('.shorts-entry'), true)">{{icon "external-link"}}<span>Show in daily note</span></button>
          <div class="cselect-divider hairline"></div>
          <button type="button" class="cselect-option shorts-entry-menu-danger" @click="more = false; deleteShort($el.closest('.shorts-entry'))">{{icon "trash"}}<span>Delete</span></button>
        </div>
      </div>
    </div>
    {{if .HTML}}<div class="prose shorts-entry-prose">{{.HTML}}</div>{{end}}
    {{if .Images}}
    <div class="shorts-img-grid{{if eq (len .Images) 1}} shorts-img-grid--one{{end}}" style="--thumbs: {{.Thumbs}}">
      {{range .Images}}
      <div class="shorts-img-cell" style="--ar: {{.Aspect}}" data-img-src="{{.URL}}" data-img-name="{{.Name}}">
        <img src="{{.URL}}" alt="{{.Name}}" loading="lazy" decoding="async">
      </div>
      {{end}}
      {{if .More}}<span class="shorts-img-more">+{{.More}}</span>{{end}}
    </div>
    {{end}}
  </article>
  {{end}}
</div>
{{end}}{{end}}
