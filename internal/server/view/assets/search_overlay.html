  <!-- Search -->
  <div x-data="searchOverlay()"
       tabindex="-1"
       @keydown.window="onKey($event)"
       @open-search.window="openWithMode($event.detail)"
       class="srch-root">

    <!-- One fixed window: input, a 400px list area and a footer. States swap
         inside it, so the frame never moves. The fade runs on the glass panel
         itself: on an ancestor, its opacity would cut off what it blurs. -->
    <div class="srch-wrap">

      <div x-show="show"
           x-cloak
           x-transition:enter="srch-enter"
           x-transition:enter-start="srch-enter-start"
           x-transition:enter-end="srch-enter-end"
           x-transition:leave="srch-leave"
           x-transition:leave-start="srch-leave-start"
           x-transition:leave-end="srch-leave-end"
           class="srch-panel">

        <div class="srch-row hairline">
          {{icon "search" `class="srch-icon" width="18" height="18"`}}
          <input type="text"
                 x-ref="input"
                 :placeholder="mode.placeholder"
                 @input="onInput($event)"
                 @compositionend="onQuery($event.target)"
                 @keydown="onInputKeydown($event)"
                 autocomplete="off"
                 autocorrect="off"
                 autocapitalize="off"
                 spellcheck="false"
                 class="srch-input">
          <button type="button" tabindex="-1" title="Filter (/)"
                  @click.prevent="toggleModeMenu()"
                  :class="{'is-open': showModes, 'has-mode': mode.field || mode.kind}"
                  class="srch-filter">
            {{icon "sliders" `width="13" height="13"`}}
            <span x-text="mode.label"></span>
            {{icon "chevron-down" `width="12" height="12"`}}
          </button>
        </div>

        <div class="srch-body" :class="{'has-preview': showPreview && results.length > 0}">
          <div x-ref="list" @mousemove="onResultHover($event)" class="srch-results-pane">
            <template x-for="(r, i) in results" :key="r.path">
              <div class="sr-item">
                <div class="srch-sec" x-show="sectionLabel(i)" x-text="sectionLabel(i)"></div>
                <a :href="r.url || '#'" :data-i="i" @click.prevent="choose(i)"
                   :class="{'is-active': i === active}"
                   class="sr-row">
                  <template x-if="r.type === 'bot'">
                    <span class="sr-tile sr-tile--avatar avatar" x-html="botAvatar(r)"></span>
                  </template>
                  <template x-if="r.type !== 'bot'">
                    <span class="sr-tile">
                      <template x-if="r.kind === 'knowledge'">{{icon "knowledge" `width="15" height="15"`}}</template>
                      <template x-if="r.kind === 'index'">{{icon "index" `width="15" height="15"`}}</template>
                      <template x-if="r.kind === 'short'">{{icon "shorts" `width="15" height="15"`}}</template>
                      <template x-if="r.kind !== 'knowledge' && r.kind !== 'index' && r.kind !== 'short'">{{icon "note" `width="15" height="15"`}}</template>
                    </span>
                  </template>
                  <span class="sr-name" x-text="r.name"></span>
                  <span class="sr-dir" x-text="r.type === 'bot' ? r.desc : r.dirLabel"></span>
                  <span class="sr-acc" :class="{'is-unread': r.type === 'bot' && r.unread > 0}" x-text="accessory(r)"></span>
                </a>
              </div>
            </template>
            <div class="sr-empty" :hidden="results.length > 0 || !listing">
              {{icon "search" `width="24" height="24"`}}
              <span class="sr-empty-title" x-text="emptyTitle"></span>
              <span class="sr-empty-hint" x-text="emptyHint"></span>
            </div>
          </div>

          <template x-if="showPreview && results.length > 0">
            <div x-ref="preview" class="srch-preview overlay-scroll">
              <template x-if="activeBot">
                <div class="srch-bot-card">
                  <span class="avatar avatar--lg" x-html="botAvatar(activeBot)"></span>
                  <span class="srch-bot-name" x-text="activeBot.name"></span>
                  <span class="srch-bot-desc" :hidden="!activeBot.desc" x-text="activeBot.desc"></span>
                </div>
              </template>
              <div class="srch-preview-pane" :hidden="activeBot || !previewHtml" x-html="previewHtml"></div>
            </div>
          </template>

          <!-- Floats over the list instead of replacing it. -->
          <div class="srch-mode-menu" :hidden="!showModes" @mousemove="onModeHover($event)"
               @click.outside="if (showModes && !$event.target.closest('.srch-filter')) closeModeMenu()">
            <template x-for="(m, i) in modes" :key="m.key">
              <button type="button" tabindex="-1" @click="selectMode(m)" :data-i="i"
                      :class="{'is-active': i === modeIdx}"
                      class="srch-mode-item">
                <span class="srch-mode-name" x-text="m.label"></span>
                <span class="srch-mode-desc" x-text="m.desc"></span>
                <span class="srch-mode-check" :hidden="m.key !== mode.key">{{icon "check" `width="14" height="14"`}}</span>
              </button>
            </template>
          </div>
        </div>

        <div class="srch-foot hairline">
          <span class="srch-foot-ctx" x-text="scopeLabel"></span>
          <template x-if="showModes">
            <span class="srch-foot-acts">
              <span class="srch-foot-act">Move <kbd class="kbd">↑↓</kbd></span>
              <span class="srch-foot-div"></span>
              <span class="srch-foot-act is-primary">Select <kbd class="kbd">↵</kbd></span>
            </span>
          </template>
          <template x-if="!showModes">
            <span class="srch-foot-acts" :class="{'is-off': !results.length}">
              <span class="srch-foot-act is-primary"><span x-text="activeBot ? 'Open chat' : 'Open'"></span> <kbd class="kbd">↵</kbd></span>
              <span class="srch-foot-div"></span>
              <span class="srch-foot-act"><span x-text="showPreview ? 'Hide preview' : 'Preview'"></span> <kbd class="kbd">tab</kbd></span>
            </span>
          </template>
        </div>
      </div>
    </div>

    <!-- Click-away catcher only: the app stays visible, undimmed. -->
    <div x-show="show" x-cloak @click="close()"
         class="srch-catcher"></div>

  </div>
