{{/* Shortcuts tab: keyboard shortcut reference list. */}}
          <div class="settings-page" x-show="tab === 'shortcuts'">
            <div class="settings-body">
              <div class="settings-list">
                <template x-for="s in shortcutDefs" :key="s.id">
                  <div class="settings-row hairline">
                    <div>
                      <span class="settings-label" x-text="s.label"></span>
                      <span class="settings-desc" x-text="s.desc"></span>
                      <span class="settings-desc settings-msg--err" x-show="recordingId === s.id && shortcutError" x-text="shortcutError"></span>
                    </div>
                    <div class="settings-row-ctrl" @click.outside="recordingId === s.id && cancelRecord()">
                      <template x-if="s.editable && customKeys[s.id] && recordingId !== s.id">
                        <button type="button" class="shortcuts-reset" @click="resetCombo(s)">Reset</button>
                      </template>
                      <button type="button" class="kbd" x-show="s.editable"
                              :class="{ 'kbd-recording': recordingId === s.id }"
                              @click="recordingId === s.id ? cancelRecord() : startRecord(s)"
                              x-text="recordingId === s.id ? 'Press shortcut…' : fmtCombo(getCombo(s))"></button>
                      <span class="kbd" x-show="!s.editable" x-text="fmtCombo(getCombo(s))"></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
