{{define "graph-section"}}<div class="sec-body sec-body--flush">
  <div style="position:relative;flex:1;display:flex;flex-direction:column;overflow:hidden">
    <div id="graph-canvas" style="flex:1;width:100%"></div>

    <div class="graph-toolbar">
      <div class="seg graph-color-mode">
        <button type="button" class="seg-btn" :class="{ active: graphColorMode === 'cluster' }" title="Color nodes by cluster" @click="setGraphColorMode('cluster')">Clusters</button>
        <button type="button" class="seg-btn" :class="{ active: graphColorMode === 'type' }" title="Color nodes by entity type" @click="setGraphColorMode('type')">Types</button>
      </div>
      <div class="graph-zoom-controls">
        <button type="button" class="icon-btn-ghost graph-zoom-btn" title="Zoom in" @click="zoomIn()">
          {{icon "plus"}}
        </button>
        <button type="button" class="icon-btn-ghost graph-zoom-btn" title="Zoom out" @click="zoomOut()">
          {{icon "minus"}}
        </button>
        <button type="button" class="icon-btn-ghost graph-zoom-btn" title="Fit all nodes" @click="zoomFit()">
          {{icon "maximize"}}
        </button>
      </div>
    </div>

    <div class="graph-node-panel" :class="{ open: !!nodePanel }">
      <div class="graph-node-panel-row">
        <span class="badge badge--sm graph-node-panel-type"
              x-show="nodePanel && nodePanel.entityType"
              x-text="nodePanel ? nodePanel.entityType : ''"></span>
        <span class="graph-node-panel-edges"
              x-text="nodePanel ? (nodePanel.edgeCount + (nodePanel.edgeCount === 1 ? ' link' : ' links')) : ''"></span>
        <button type="button" class="icon-btn-ghost graph-node-panel-close" @click="_clearFocus()" title="Close">
          {{icon "close"}}
        </button>
      </div>
      <div class="graph-node-panel-title" x-text="nodePanel ? nodePanel.label : ''"></div>
    </div>

    <div class="graph-loading" x-show="loading" x-cloak>
      <span>Loading graph…</span>
    </div>
  </div>
</div>
<div class="empty-state empty-state--page" x-show="!loading && empty" x-cloak>
  <div class="empty-state-icon">{{sideIcon "knowledge"}}</div>
  <div class="empty-state-title">No knowledge yet</div>
  <div class="empty-state-desc">Hylo compiles your notes into linked knowledge. Compile a note, or clip a page into Web Clips.</div>
</div>
{{end}}
