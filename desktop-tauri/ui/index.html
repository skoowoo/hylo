<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hylo</title>
  <style>
    /* Tokens mirror internal/server/view/shared_tokens.go so this page reads as part of the app.
       Keep them in step by hand: the shell page is not served by Hylo, so it cannot import them. */
    :root {
      --ink-rgb: 238, 240, 244;
      --accent-rgb: 94, 106, 210;
      --bg: #18191e; --fg: #eef0f4; --muted: #8d92a0; --muted-soft: #656a78;
      --surface-soft: #212229; --surface-2: #292a33;
      --accent: #5e6ad2; --accent-fg: #ffffff; --accent-hov: #7b86e8;
      --s-ok: #34c481; --s-ok-bg: rgba(39, 166, 68, 0.16);
      --s-err: #f87171; --s-err-bg: rgba(248, 113, 113, 0.14); --s-err-fg: #000000;
      --s-warn: #eeae3a; --s-warn-bg: rgba(251, 191, 36, 0.14);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --ink-rgb: 24, 24, 27;
        --bg: #f9f9fb; --fg: #18181b; --muted: #6d7080; --muted-soft: #9b9eac;
        --surface-soft: #f5f5f7; --surface-2: #e3e3e9;
        --accent-hov: #4c56c8;
        --s-ok: #059669; --s-ok-bg: rgba(16, 185, 129, 0.08);
        --s-err: #dc2626; --s-err-bg: rgba(239, 68, 68, 0.06); --s-err-fg: #ffffff;
        --s-warn: #d97706; --s-warn-bg: rgba(217, 119, 6, 0.07);
      }
    }

    :root {
      --btn-bg: rgba(var(--ink-rgb), 0.06);
      --btn-bg-hov: rgba(var(--ink-rgb), 0.10);
      --btn-bg-on: rgba(var(--ink-rgb), 0.15);
      --card-hov: rgba(var(--accent-rgb), 0.10);
      --control-active-bg: var(--surface-2);
      --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
      --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --text-xs: 0.75rem; --text-sm: 0.8125rem; --text-base: 0.875rem;
      --text-2xs: 0.6875rem; --text-3xs: 0.625rem; --text-title-lg: 1.375rem;
      --fw-medium: 500; --fw-semibold: 600;
      --btn-h: 32px; --btn-h-xs: 28px;
      --motion-fast: 100ms;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: var(--r-md);
    }

    html, body {
      height: 100%;
      border-radius: 0;
    }

    *:focus-visible {
      outline: 2px solid rgba(var(--accent-rgb), 0.5);
      outline-offset: 1px;
    }

    button:not(:disabled) { cursor: pointer; }
    button:disabled { cursor: default; }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-ui);
      font-size: var(--text-base);
      -webkit-font-smoothing: antialiased;
      -webkit-app-region: drag;
    }

    /* Both views share width and top anchor so the logo stays put when switching. */
    .shell {
      -webkit-app-region: no-drag;
      width: min(520px, 92vw);
      max-height: 100%;
      margin-top: 18vh;
      display: flex;
      flex-direction: column;
    }


    .logo {
      font-size: var(--text-title-lg);
      font-weight: var(--fw-semibold);
      letter-spacing: 0.2em;
      line-height: 1;
      margin-bottom: 1.75rem;
      user-select: none;
    }

    /* Shared with the app: buttons are borderless, tonal or accent-filled. */
    .btn-outline, .btn-solid {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
      height: var(--btn-h); padding: 0 0.875rem;
      border: none;
      font-family: inherit; font-size: var(--text-base); font-weight: var(--fw-medium);
      white-space: nowrap; flex-shrink: 0;
      transition: background-color var(--motion-fast), color var(--motion-fast);
    }
    .btn-outline svg, .btn-solid svg { width: 13px; height: 13px; flex-shrink: 0; }
    .btn-outline { background: var(--btn-bg); color: var(--fg); }
    .btn-outline:hover:not(:disabled) { background: var(--btn-bg-hov); }
    .btn-outline:active:not(:disabled) { background: var(--btn-bg-on); }
    .btn-solid { background: var(--accent); color: var(--accent-fg); }
    .btn-solid:hover:not(:disabled) { background: var(--accent-hov); }
    .btn-solid:active:not(:disabled) { opacity: 0.85; }
    .btn-outline:disabled, .btn-solid:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-outline--danger:hover:not(:disabled),
    .btn-outline--danger:focus-visible { color: var(--s-err); background: var(--s-err-bg); }
    .btn--xs { height: var(--btn-h-xs); padding: 0 0.65rem; font-size: var(--text-xs); }
    .btn--block { width: 100%; }

    .field-input {
      width: 100%; height: var(--btn-h); padding: 0 0.7rem;
      background: var(--btn-bg); border: 1px solid transparent;
      font-family: var(--font-mono); font-size: var(--text-sm); color: var(--fg);
      outline: none;
    }
    .field-input:focus { border-color: var(--accent); }
    .field-input::placeholder { color: var(--muted-soft); font-style: italic; }

    .badge {
      display: inline-flex; align-items: center; flex-shrink: 0;
      font-size: var(--text-2xs); font-weight: var(--fw-medium);
      padding: 1px 7px; border-radius: var(--r-full); white-space: nowrap;
    }
    .badge--ok { color: var(--s-ok); background: var(--s-ok-bg); }

    .list-card {
      padding: 0.625rem 0.875rem;
      border-radius: var(--r-lg);
      background: var(--surface-soft);
    }
    .list-card--clickable { width: 100%; border: none; color: var(--fg); font-family: inherit; text-align: left; }
    .list-card--clickable:hover { background: var(--card-hov); }
    .list-card--clickable:active { opacity: 0.85; }
    .list-card.is-active { background: var(--control-active-bg); }

    .srv-dot {
      display: inline-block; flex-shrink: 0; width: 7px; height: 7px;
      border-radius: 50%; background: var(--muted-soft);
    }
    .srv-dot.is-online { background: var(--s-ok); }
    .srv-dot.is-offline { background: var(--s-err); }
    .srv-dot.is-auth_required { background: var(--s-warn); }
    .srv-dot.is-accent { background: var(--accent); }
    .srv-dot.is-pulse { background: var(--accent); animation: blink 0.85s step-start infinite; }

    @keyframes blink {
      0%, 49% { opacity: 1 }
      50%, 100% { opacity: 0 }
    }

    .server-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 1rem;
    }

    .server-list[hidden] { display: none; }

    .server-item { display: flex; align-items: center; gap: 0.625rem; }

    .srv-name { font-size: var(--text-base); font-weight: var(--fw-medium); }

    .srv-url {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: var(--text-xs);
      color: var(--muted);
    }

    /* Connect view */
    .status-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 1.1rem;
    }

    .status-txt {
      font-size: var(--text-3xs);
      font-weight: var(--fw-semibold);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .status-txt.error { color: var(--s-err); }
    .status-txt.ok { color: var(--s-ok); }

    .hint {
      margin-top: 0.875rem;
      padding: 0.625rem 0.75rem;
      background: var(--surface-soft);
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      line-height: 1.6;
      color: var(--muted);
      word-break: break-all;
      white-space: pre-wrap;
    }

    .hint[hidden] { display: none; }

    .start-btn { margin-top: 1.25rem; }
    .start-btn[hidden] { display: none; }


    /* Server manager (#servers) */
    .shell[hidden] { display: none; }

    .section-title {
      margin-bottom: 0.75rem;
      font-size: var(--text-xs); font-weight: var(--fw-semibold); color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
    }

    #mgr-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0; }

    .mgr-row-main { display: flex; align-items: center; gap: 0.625rem; }

    .row-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }

    .row-text .srv-name { display: flex; align-items: center; gap: 6px; }

    .mgr-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .mgr-form { display: flex; flex-direction: column; gap: 8px; margin-top: 0.75rem; }
    .mgr-form[hidden] { display: none; }

    .mgr-msg { font-size: var(--text-xs); line-height: 1.5; color: var(--s-err); }
    .mgr-msg.warn { color: var(--s-warn); }
    .mgr-msg[hidden] { display: none; }

    #mgr-add-form { padding: 0.75rem 0.875rem; background: var(--surface-soft); border-radius: var(--r-lg); margin-top: 6px; }

    .view-footer { display: flex; justify-content: space-between; margin-top: 0.75rem; }
  </style>
</head>

<body data-tauri-drag-region>
  <div id="view-connect" class="shell">
    <p class="logo">HYLO</p>

    <div id="server-list" class="server-list" hidden></div>

    <div class="status-row">
      <span id="dot" class="srv-dot is-pulse"></span>
      <span id="status" class="status-txt">connecting</span>
    </div>
    <p id="hint" class="hint" hidden></p>

    <button id="start-btn" class="btn-solid btn--block start-btn" hidden>
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-7-7 7 7-7 7" />
      </svg>
      Start Server
    </button>

    <div class="view-footer">
      <button id="manage-btn" class="btn-outline" type="button">Manage servers</button>
    </div>
  </div>

  <div id="view-servers" class="shell manager" hidden>
    <p class="logo">HYLO</p>
    <p class="section-title">Servers</p>
    <div id="mgr-list"></div>
    <form id="mgr-add-form" class="mgr-form" hidden>
      <input id="mgr-add-name" class="field-input" placeholder="Name (optional)" spellcheck="false" autocomplete="off">
      <input id="mgr-add-url" class="field-input" type="url" placeholder="https://hylo.example.com" spellcheck="false"
        autocomplete="off">
      <input id="mgr-add-key" class="field-input" type="password" placeholder="API key" spellcheck="false"
        autocomplete="off">
      <p id="mgr-add-warn" class="mgr-msg warn" hidden>This address uses http://, so the API key is sent unencrypted.
        Prefer https:// when you can.</p>
      <p id="mgr-add-err" class="mgr-msg" hidden></p>
      <div class="mgr-actions">
        <button id="mgr-add-submit" class="btn-solid btn--xs" type="submit">Add server</button>
        <button id="mgr-add-cancel" class="btn-outline btn--xs" type="button">Cancel</button>
      </div>
    </form>
    <div class="view-footer">
      <button id="mgr-add-open" class="btn-outline" type="button">Add server</button>
      <button id="mgr-back" class="btn-outline" type="button">Back</button>
    </div>
  </div>

  <script>
    (function () {
      const serverListEl = document.getElementById('server-list');
      const dotEl = document.getElementById('dot');
      const statusEl = document.getElementById('status');
      const hintEl = document.getElementById('hint');
      const startBtn = document.getElementById('start-btn');

      let servers = [];
      let tryingId = '';
      let health = {};
      let listVisible = false;
      let retryTimer = null;
      let attemptGen = 0;
      let isRetrying = false; // suppresses the "connecting" flash on background retries
      let detachStartConsumed = false;
      let spawnedLocalServerOk = false;

      function shell() { return window.hyloDesktop; }

      function current() {
        return servers.find(function (s) { return s.id === tryingId; }) || null;
      }

      function setUI(state, msg, hint) {
        if (isRetrying && state === 'connecting') return;

        dotEl.className = 'srv-dot ' + (
          state === 'ok' ? 'is-online' :
            state === 'error' ? 'is-offline' : 'is-pulse'
        );
        statusEl.textContent = msg;
        statusEl.className = 'status-txt' + (
          state === 'error' ? ' error' :
            state === 'ok' ? ' ok' : ''
        );

        const h = (hint || '').trim();
        if (!h) {
          hintEl.hidden = true;
        } else if (hintEl.textContent !== h) {
          hintEl.textContent = h;
          hintEl.hidden = false;
        } else {
          hintEl.hidden = false;
        }
      }

      function showStart(v) {
        startBtn.hidden = !v;
      }

      // Name, "Current" tag and address: one recipe for the launcher list and the manager.
      function rowText(s) {
        const text = el('div', 'row-text');
        const name = el('span', 'srv-name', s.name);
        if (s.active) name.append(el('span', 'badge badge--ok', 'Current'));
        text.append(name, el('span', 'srv-url', s.kind === 'local' ? 'This computer · ' + s.url : s.url));
        return text;
      }

      function render() {
        serverListEl.replaceChildren();
        serverListEl.hidden = !listVisible || servers.length < 2;
        serverListEl.append(el('p', 'section-title', 'Servers'));
        for (const s of servers) {
          const btn = el('button', 'list-card list-card--clickable server-item' + (s.id === tryingId ? ' is-active' : ''));
          btn.type = 'button';
          btn.append(el('span', 'srv-dot' + (health[s.id] ? ' is-' + health[s.id] : '')), rowText(s));
          btn.addEventListener('click', function () { choose(s.id); });
          serverListEl.append(btn);
        }
      }

      function revealChoices() {
        listVisible = true;
        render();
      }

      async function debugPaths() {
        try {
          if (shell()?.getShellDebugPaths) return await shell().getShellDebugPaths();
        } catch { }
        return {};
      }

      function schedule(ms) {
        clearTimeout(retryTimer);
        retryTimer = setTimeout(function () { attempt(); }, ms);
      }

      async function attempt({ userInitiated = false } = {}) {
        const gen = ++attemptGen;
        clearTimeout(retryTimer);
        const s = current();
        showStart(false);
        setUI('connecting', 'connecting');
        if (!s) {
          setUI('error', 'cannot connect', 'No server is registered.');
          return;
        }

        const url = s.url.trim().replace(/\/$/, '');
        const local = s.kind === 'local';
        const api = shell();
        let ok = false;
        if (api) {
          try { ok = await api.checkServer(url); } catch { }
        }
        if (gen !== attemptGen) return;

        if (ok) {
          isRetrying = false;
          detachStartConsumed = false;
          spawnedLocalServerOk = false;
          try {
            if (api) await api.servers.switchTo(s.id);
            setUI('ok', 'connected');
          } catch (e) {
            revealChoices();
            setUI('error', 'cannot connect', String((e && e.message) || e || ''));
            schedule(3000);
          }
          return;
        }

        const paths = await debugPaths();
        if (gen !== attemptGen) return;

        let retryMs = 3000;
        let pendingStart = false;
        let manualStart = false;
        let headline = '';
        let hint = '';
        let keepTrying = true;

        if (!api) {
          headline = 'preload api unavailable';
          hint = 'Desktop API not found. Check DevTools.';
          keepTrying = false;
        } else if (local && !detachStartConsumed) {
          try {
            detachStartConsumed = true;
            const st = await api.startHyloServerDetached({ userInitiated });
            if (gen !== attemptGen) return;
            if (st.ok) {
              spawnedLocalServerOk = true;
              pendingStart = true;
              retryMs = 1400;
            } else if (st.reason === 'stopped_by_user') {
              isRetrying = false;
              showStart(true);
              revealChoices();
              setUI('error', 'server stopped');
              return;
            } else {
              spawnedLocalServerOk = false;
              detachStartConsumed = false;
              manualStart = true;
              headline = 'server start failed';
              hint = (st.error ? st.error + '\n\n' : '') +
                'Server output:\n' + (paths.serverOutput || '');
            }
          } catch (e) {
            if (gen !== attemptGen) return;
            detachStartConsumed = false;
            manualStart = true;
            headline = 'connection error';
            hint = String((e && e.message) || e);
          }
        } else if (spawnedLocalServerOk && local) {
          headline = 'waiting for server';
          hint = (paths.serverOutput || '') +
            (paths.diagnostics ? '\n\nShell log:\n' + paths.diagnostics : '');
        } else if (local) {
          detachStartConsumed = false;
          manualStart = true;
          headline = 'server start failed';
          hint = (paths.serverOutput || '') +
            (paths.diagnostics ? '\n\nShell log:\n' + paths.diagnostics : '');
        } else {
          headline = 'cannot connect';
        }

        if (gen !== attemptGen) return;
        isRetrying = keepTrying;
        showStart(manualStart);
        revealChoices();
        setUI(
          pendingStart ? 'starting' : 'error',
          pendingStart ? 'starting server' : headline,
          pendingStart ? '' : hint
        );
        if (keepTrying) schedule(retryMs);
      }

      function choose(id) {
        if (!servers.some(function (s) { return s.id === id; })) return;
        tryingId = id;
        isRetrying = false;
        detachStartConsumed = false;
        spawnedLocalServerOk = false;
        render();
        if (location.hash === '#servers') {
          location.hash = '';
          return;
        }
        attempt({ userInitiated: true });
      }

      async function probe() {
        const api = shell() && shell().servers;
        if (!api) return;
        try {
          const out = await api.probe();
          health = {};
          for (const p of out) health[p.id] = p.health;
          render();
          renderManager();
        } catch { }
      }

      startBtn.addEventListener('click', function () {
        isRetrying = false;
        detachStartConsumed = false;
        spawnedLocalServerOk = false;
        attempt({ userInitiated: true });
      });

      // ── Server manager (#servers) ──────────────────────────────────────────
      const connectView = document.getElementById('view-connect');
      const mgrView = document.getElementById('view-servers');
      const mgrList = document.getElementById('mgr-list');
      const addForm = document.getElementById('mgr-add-form');
      const addUrl = document.getElementById('mgr-add-url');
      const addWarn = document.getElementById('mgr-add-warn');
      const addErr = document.getElementById('mgr-add-err');
      const addSubmit = document.getElementById('mgr-add-submit');
      const addOpen = document.getElementById('mgr-add-open');

      let editId = '';
      let removeArm = '';

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }

      function button(label, kind, onClick) {
        const cls = kind === 'solid' ? 'btn-solid' : kind === 'danger' ? 'btn-outline btn-outline--danger' : 'btn-outline';
        const b = el('button', cls + ' btn--xs', label);
        b.type = 'button';
        b.addEventListener('click', onClick);
        return b;
      }

      function isInsecure(raw) {
        try {
          const u = new URL(raw);
          return u.protocol === 'http:' && ['localhost', '127.0.0.1', '[::1]'].indexOf(u.hostname) < 0;
        } catch { return false; }
      }

      function errorText(e) {
        const code = e && e.code;
        if (code === 'bad_key') return 'The API key was rejected. Run "hylo auth show" on that server to see it.';
        if (code === 'not_hylo') return 'This address does not look like a Hylo server.';
        if (code === 'unreachable') return 'Cannot reach this address. Check the URL and that the server is running.';
        return String((e && e.message) || e || 'Something went wrong.');
      }

      function showMsg(node, text) {
        node.textContent = text || '';
        node.hidden = !text;
      }

      async function reloadServers() {
        const listed = await shell().servers.list();
        servers = listed.servers || [];
        tryingId = listed.activeId || (servers[0] && servers[0].id) || '';
        renderManager();
      }

      function editForm(s) {
        const form = el('form', 'mgr-form');
        const name = el('input', 'field-input');
        name.value = s.name;
        name.placeholder = 'Name';
        name.spellcheck = false;
        form.append(name);
        let key = null;
        if (s.kind !== 'local') {
          key = el('input', 'field-input');
          key.type = 'password';
          key.autocomplete = 'off';
          key.spellcheck = false;
          key.placeholder = s.hasKey ? 'New API key (leave empty to keep the stored one)' : 'API key';
          form.append(key);
        }
        const err = el('p', 'mgr-msg');
        err.hidden = true;
        const save = el('button', 'btn-solid btn--xs', 'Save');
        save.type = 'submit';
        const actions = el('div', 'mgr-actions');
        actions.append(save, button('Cancel', '', function () { editId = ''; renderManager(); }));
        form.append(err, actions);
        form.addEventListener('submit', async function (ev) {
          ev.preventDefault();
          save.disabled = true;
          save.textContent = 'Checking…';
          const opts = { name: name.value };
          if (key && key.value.trim()) opts.key = key.value.trim();
          try {
            await shell().servers.update(s.id, opts);
            editId = '';
            await reloadServers();
            probe();
          } catch (e) {
            save.disabled = false;
            save.textContent = 'Save';
            showMsg(err, errorText(e));
          }
        });
        return form;
      }

      function renderManager() {
        mgrList.replaceChildren();
        for (const s of servers) {
          const row = el('div', 'list-card');
          const main = el('div', 'mgr-row-main');
          main.append(el('span', 'srv-dot' + (health[s.id] ? ' is-' + health[s.id] : '')));

          const actions = el('div', 'mgr-actions');
          actions.append(button('Open', 'solid', function () { choose(s.id); }));
          actions.append(button('Edit', '', function () {
            editId = editId === s.id ? '' : s.id;
            renderManager();
          }));
          if (s.kind !== 'local') {
            actions.append(button(removeArm === s.id ? 'Confirm?' : 'Remove', 'danger', async function () {
              if (removeArm !== s.id) { removeArm = s.id; renderManager(); return; }
              removeArm = '';
              try { await shell().servers.remove(s.id); } catch { }
              await reloadServers();
            }));
          }
          main.append(rowText(s), actions);
          row.append(main);
          if (editId === s.id) row.append(editForm(s));
          mgrList.append(row);
        }
      }

      function openAddForm() {
        addForm.reset();
        showMsg(addErr, '');
        addWarn.hidden = true;
        addForm.hidden = false;
        addOpen.hidden = true;
        addUrl.focus();
      }

      function closeAddForm() {
        addForm.hidden = true;
        addOpen.hidden = false;
      }

      addUrl.addEventListener('input', function () { addWarn.hidden = !isInsecure(addUrl.value.trim()); });
      addOpen.addEventListener('click', openAddForm);
      document.getElementById('mgr-add-cancel').addEventListener('click', closeAddForm);
      document.getElementById('mgr-back').addEventListener('click', function () { location.hash = ''; });
      document.getElementById('manage-btn').addEventListener('click', function () { location.hash = '#servers'; });

      addForm.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        if (!addUrl.value.trim()) return;
        addSubmit.disabled = true;
        addSubmit.textContent = 'Checking…';
        showMsg(addErr, '');
        try {
          await shell().servers.add({
            name: document.getElementById('mgr-add-name').value,
            url: addUrl.value.trim(),
            key: document.getElementById('mgr-add-key').value,
          });
          closeAddForm();
          await reloadServers();
          probe();
        } catch (e) {
          showMsg(addErr, errorText(e));
        } finally {
          addSubmit.disabled = false;
          addSubmit.textContent = 'Add server';
        }
      });

      function route() {
        const manager = location.hash === '#servers';
        connectView.hidden = manager;
        mgrView.hidden = !manager;
        if (manager) {
          attemptGen++;
          clearTimeout(retryTimer);
          closeAddForm();
          reloadServers().then(probe).catch(function () { });
        } else {
          isRetrying = false;
          detachStartConsumed = false;
          spawnedLocalServerOk = false;
          attempt();
        }
      }

      window.addEventListener('hashchange', route);

      async function init() {
        const api = shell();
        if (!api || !api.servers) {
          setUI('error', 'preload api unavailable', 'Desktop API not found. Check DevTools.');
          return;
        }
        try {
          const listed = await api.servers.list();
          servers = listed.servers || [];
          tryingId = listed.activeId || (servers[0] && servers[0].id) || '';
          render();
        } catch (e) {
          setUI('error', 'cannot connect', String((e && e.message) || e || ''));
          return;
        }
        if (location.hash !== '#servers') probe();
        route();
      }

      init();
    })();
  </script>
</body>

</html>
