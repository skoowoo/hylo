[package]
name = "hylo-desktop-tauri"
version = "0.1.1"
description = "Desktop shell for the local Hylo web app"
edition = "2021"
rust-version = "1.90"

[lib]
name = "hylo_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
libc = "0.2"
open = "4"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAnimation", "NSAnimationContext", "NSApplication", "NSResponder", "NSScreen", "NSView", "NSWindow", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSNotification", "NSString", "NSOperation", "block2"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
